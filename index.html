  return `
    <div class="step-nav">
      <button class="btn" id="navPrev" ${si === 0 ? "disabled" : ""}>← Prev</button>
      ${stepDotsHTML(li, si)}
      <button class="btn ${nextEnabled ? "primary" : ""}" id="navNext" ${nextEnabled ? "" : "disabled"}>${isLast ? "Finish Level 🎉" : "Next →"}</button>
    </div>`;
}
function wireNav(li, si){
  const prev = document.getElementById("navPrev");
  const next = document.getElementById("navNext");
  if(prev) prev.addEventListener("click", () => { store.level = li; store.step = si - 1; saveStore(); render(); });
  if(next) next.addEventListener("click", () => {
    const l = LEVELS[li];
    if(si === l.steps.length - 1){
      // 最后一节完成 → 进入复习总结页（Learn → Practice → Review → Next）
      renderReview(li);
    } else {
      store.level = li; store.step = si + 1; saveStore(); render();
    }
  });
}

let lastRenderedLevel = -1;
function render(){
  currentTerminalValidator = null;
  // 跨关时重置终端：切换 shell 模式（ps/bash/wsl）并恢复该关的初始文件系统，
  // 否则上一关留下的 cwd / shell 会泄漏进新关卡（例如从 8.5 进 8.6 仍是 PowerShell）。
  if(store.level !== lastRenderedLevel){
    lastRenderedLevel = store.level;
    resetTerminal(true);
  }
  const li = store.level, si = store.step;
  const level = LEVELS[li];
  const step = level.steps[si];
  terminalDock.classList.toggle("hidden", step.type !== "terminal");

  if(step.type === "complete"){ renderReview(li); return; }

  let html = kickerHTML(li, si) + `<h2 class="step-title">${esc(step.title)}</h2>`;

  if(step.type === "concept"){
    if(step.bodyEn){
      // 语言框架：English-first，中文按需显示（Level 4+ 内容将默认提供 bodyEn）
      html += `<div class="card"><div id="enBody">${step.bodyEn}</div><div id="zhBody" style="display:none">${step.body}</div>
        <div style="margin-top:10px"><button class="btn" id="langToggle" style="font-size:12px;padding:5px 12px">💡 中文解释 / Show Chinese</button></div></div>`;
    } else {
      html += `<div class="card">${step.body}</div>`;
    }
    if(step.visual) html += step.visual;
    if(step.key) html += `<div class="key-point">🧠 <strong>Mental model：</strong>${step.key}</div>`;
    html += `<div style="margin-top:6px"><button class="btn success" id="understoodBtn">Got it — Continue →</button></div>`;
    html += navHTML(li, si, false);
    stepContent.innerHTML = html;
    document.getElementById("understoodBtn").addEventListener("click", () => {
      markStepDone(li, si);
      document.getElementById("navNext").disabled = false;
      document.getElementById("navNext").classList.add("primary");
      document.getElementById("understoodBtn").disabled = true;
      document.getElementById("understoodBtn").textContent = "✓ Done";
    });
    const lt = document.getElementById("langToggle");
    if(lt){
      lt.addEventListener("click", () => {
        const en = document.getElementById("enBody"), zh = document.getElementById("zhBody");
        const showingZh = zh.style.display !== "none";
        zh.style.display = showingZh ? "none" : "block";
        en.style.display = showingZh ? "block" : "none";
        lt.textContent = showingZh ? "💡 中文解释 / Show Chinese" : "🇬🇧 English";
      });
    }
  }

  if(step.type === "explore"){
    html += `<div class="card">${step.body}</div>`;
    html += `<div class="ft-note">📁 点击文件夹展开 / 收起</div>`;
    html += `<div class="filetree" id="ftRoot"></div>`;
    if(step.key) html += `<div class="key-point">🧠 <strong>Mental model：</strong>${step.key}</div>`;
    html += `<div style="margin-top:6px"><button class="btn success" id="exploreDoneBtn">Done Exploring — Continue →</button></div>`;
    html += navHTML(li, si, false);
    stepContent.innerHTML = html;
    buildFileTree(document.getElementById("ftRoot"), term.fs, []);
    document.getElementById("exploreDoneBtn").addEventListener("click", () => {
      markStepDone(li, si);
      document.getElementById("navNext").disabled = false;
      document.getElementById("navNext").classList.add("primary");
      document.getElementById("exploreDoneBtn").disabled = true;
      document.getElementById("exploreDoneBtn").textContent = "✓ Done";
    });
  }

  if(step.type === "predict"){
    html += `<div class="card"><div class="predict-scenario">${step.scenario}</div>`;
    html += `<div class="opt-list">` + step.options.map((o, i) =>
      `<button class="opt" data-i="${i}"><span class="opt-key">${"ABCD"[i]}</span><span>${o.t}</span></button>`).join("") + `</div>`;
    html += `<div class="feedback" id="fb"></div></div>`;
    html += navHTML(li, si, false);
    stepContent.innerHTML = html;
    const fb = document.getElementById("fb");
    let answered = false;
    stepContent.querySelectorAll(".opt").forEach(btn => {
      btn.addEventListener("click", () => {
        if(answered) return;
        const i = Number(btn.dataset.i);
        const opt = step.options[i];
        if(opt.ok){
          answered = true;
          btn.classList.add("correct");
          stepContent.querySelectorAll(".opt").forEach(b => b.disabled = true);
          fb.className = "feedback show ok";
          fb.innerHTML = `<strong>✅ Correct!</strong> <br>${step.explain}`;
          markStepDone(li, si);
          const nx = document.getElementById("navNext");
          nx.disabled = false; nx.classList.add("primary");
        } else {
          btn.classList.add("wrong");
          btn.disabled = true;
          fb.className = "feedback show no";
          fb.innerHTML = `<strong>❌ Not quite.</strong> ${opt.why || "Think again — the concept in the previous step has the clue."}<br>(wrong option eliminated — keep trying)`;
        }
      });
    });
  }

  /* ===== v1.3 Level 8 新题型共享工具 ===== */
  const finishStep = () => {
    markStepDone(li, si);
    const nx = document.getElementById("navNext");
    nx.disabled = false; nx.classList.add("primary");
  };
  const hintUI = `<div class="task-actions"><button class="btn" id="hintBtn2">💡 Hint</button></div><div class="hint-box" id="hintBox2"></div>`;
  const wireHint = (s) => {
    let lvl = 0;
    const hb = document.getElementById("hintBox2");
    if(!hb) return;
    document.getElementById("hintBtn2").addEventListener("click", () => {
      if(lvl < s.hints.length){
        hb.classList.add("show");
        hb.innerHTML = "<strong>Hint " + (lvl + 1) + "/" + s.hints.length + ":</strong> " + s.hints[lvl];
        lvl++;
      } else {
        hb.innerHTML = "<strong>No more hints.</strong> Think about the concept a few steps back — the answer is hiding there.";
      }
    });
  };
  const showOk = (el, msg) => { el.className = "feedback show ok"; el.innerHTML = "<strong>✅ Correct!</strong><br>" + msg; };

  /* ---- multiselect：多个正确答案 ---- */
  if(step.type === "multiselect"){
    html += `<div class="card"><div class="predict-scenario">${step.scenario}</div>
      <div class="ms-list">` + step.options.map((o, i) =>
        `<label class="ms-opt" data-i="${i}"><input type="checkbox"><span>${o.t}</span></label>`).join("") + `</div>
      <div class="task-actions" style="margin-top:12px"><button class="btn primary" id="msCheck">Check</button></div>
      <div class="feedback" id="fb"></div>${hintUI}</div>`;
    if(step.key) html += `<div class="key-point">🧠 <strong>Mental model：</strong>${step.key}</div>`;
    html += navHTML(li, si, false);
    stepContent.innerHTML = html;
    wireHint(step);
    let done = false;
    document.getElementById("msCheck").addEventListener("click", () => {
      if(done) return;
      const fb = document.getElementById("fb");
      const boxes = Array.from(stepContent.querySelectorAll(".ms-opt"));
      const sel = boxes.filter(b => b.querySelector("input").checked && !b.classList.contains("eliminated"));
      const correctIdx = step.options.map((o, i) => o.ok ? i : -1).filter(i => i >= 0);
      const selIdx = sel.map(b => Number(b.dataset.i));
      const wrongPicked = selIdx.filter(i => !step.options[i].ok);
      const missing = correctIdx.filter(i => !selIdx.includes(i));
      if(wrongPicked.length === 0 && missing.length === 0){
        done = true;
        boxes.forEach((b, i) => { b.querySelector("input").disabled = true; if(step.options[i].ok) b.classList.add("picked"); });
        showOk(fb, step.explain);
        finishStep();
      } else {
        wrongPicked.forEach(i => {
          const b = boxes[i];
          b.classList.add("eliminated");
          b.querySelector("input").checked = false;
          b.querySelector("input").disabled = true;
        });
        fb.className = "feedback show no";
        let msg = "";
        if(wrongPicked.length) msg += wrongPicked.map(i => "<strong>" + esc(step.options[i].t) + "</strong>：" + (step.options[i].why || "不对——再想想它到底是什么。")).join("<br>");
        if(missing.length) msg += (msg ? "<br>" : "") + "还没选全：有 " + missing.length + " 个正确答案还没被选中。";
        fb.innerHTML = "<strong>❌ Not quite.</strong> " + msg + "<br>(错误选项已排除——继续)";
      }
    });
  }

  /* ---- matching：连线匹配 ---- */
  if(step.type === "matching"){
    html += `<div class="card">`;
    if(step.scenario) html += `<div class="predict-scenario">${step.scenario}</div>`;
    html += `<div class="match-grid">` + step.pairs.map((p, i) =>
      `<div class="match-left">${p.l}</div>
       <select class="match-sel" data-i="${i}"><option value="">选择匹配项…</option>` +
       step.choices.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join("") + `</select>`).join("") +
      `</div>
      <div class="task-actions" style="margin-top:12px"><button class="btn primary" id="mcCheck">Check</button></div>
      <div class="feedback" id="fb"></div>${hintUI}</div>`;
    if(step.key) html += `<div class="key-point">🧠 <strong>Mental model：</strong>${step.key}</div>`;
    html += navHTML(li, si, false);
    stepContent.innerHTML = html;
    wireHint(step);
    let done = false;
    document.getElementById("mcCheck").addEventListener("click", () => {
      if(done) return;
      const fb = document.getElementById("fb");
      const sels = Array.from(stepContent.querySelectorAll(".match-sel"));
      const wrong = [];
      sels.forEach((s, i) => { s.classList.remove("bad", "good"); if(s.value !== step.pairs[i].r) wrong.push(i); });
      if(wrong.length === 0){
        done = true;
        sels.forEach(s => { s.disabled = true; s.classList.add("good"); });
        showOk(fb, step.explain);
        finishStep();
      } else {
        wrong.forEach(i => sels[i].classList.add("bad"));
        fb.className = "feedback show no";
        fb.innerHTML = "<strong>❌ " + wrong.length + " 处不匹配。</strong> 红色下拉框是错的——想想那个东西的本质角色，重选后再 Check。" + (step.whyWrong || "");
      }
    });
  }

  /* ---- ordering：排出正确顺序 ---- */
  if(step.type === "ordering"){
    html += `<div class="card"><div class="predict-scenario">${step.scenario}</div>
      <div class="order-lane"><div class="order-lane-label">按发生顺序点击下面的条目（再点可撤回）：</div>
        <div class="order-ans" id="orderAns"><span style="color:var(--dim);font-size:13px">（空的——从下方点击添加）</span></div>
      </div>
      <div class="order-pool" id="orderPool">` +
      step.items.map(it => `<button class="order-chip" data-id="${esc(it.id)}">${esc(it.t)}</button>`).join("") + `</div>
      <div class="task-actions"><button class="btn primary" id="odCheck">Check</button><button class="btn" id="odReset">Reset</button></div>
      <div class="feedback" id="fb"></div>${hintUI}</div>`;
    if(step.key) html += `<div class="key-point">🧠 <strong>Mental model：</strong>${step.key}</div>`;
    html += navHTML(li, si, false);
    stepContent.innerHTML = html;
    wireHint(step);
    let done = false;
    const ans = [];
    const renderAns = () => {
      const lane = document.getElementById("orderAns");
      lane.innerHTML = ans.length === 0 ? '<span style="color:var(--dim);font-size:13px">（空的——从下方点击添加）</span>'
        : ans.map((id, n) => { const it = step.items.find(x => x.id === id);
            return `<button class="order-chip seq" data-id="${esc(id)}"><span class="seq-n">${n + 1}</span>${esc(it.t)}</button>`; }).join("");
      lane.querySelectorAll(".order-chip.seq").forEach(ch => ch.addEventListener("click", () => {
        if(done) return;
        const id = ch.dataset.id;
        ans.splice(ans.indexOf(id), 1);
        stepContent.querySelector(`#orderPool .order-chip[data-id="${CSS.escape(id)}"]`).classList.remove("used");
        renderAns();
      }));
    };
    stepContent.querySelectorAll("#orderPool .order-chip").forEach(ch => ch.addEventListener("click", () => {
      if(done || ch.classList.contains("used")) return;
      ch.classList.add("used");
      ans.push(ch.dataset.id);
      renderAns();
    }));
    document.getElementById("odReset").addEventListener("click", () => {
      if(done) return;
      ans.length = 0;
      stepContent.querySelectorAll("#orderPool .order-chip").forEach(c => c.classList.remove("used"));
      renderAns();
    });
    document.getElementById("odCheck").addEventListener("click", () => {
      if(done) return;
      const fb = document.getElementById("fb");
      if(ans.length < step.items.length){
        fb.className = "feedback show no";
        fb.innerHTML = "<strong>还没排完。</strong> 把所有 " + step.items.length + " 个条目都排进去再 Check。";
        return;
      }
      if(ans.every((id, n) => id === step.order[n])){
        done = true;
        showOk(fb, step.explain);
        finishStep();
      } else {
        fb.className = "feedback show no";
        fb.innerHTML = "<strong>❌ 顺序不对。</strong> 从「谁最先发生」开始想：你按下 Enter 之后，第一个动的是谁？";
      }
    });
  }

  /* ---- fill：补全命令/概念 ---- */
  if(step.type === "fill"){
    const accepts = Array.isArray(step.answer) ? step.answer : [step.answer];
    html += `<div class="card"><div class="predict-scenario">${step.scenario}</div>
      <div class="fill-line">${step.before}<input class="fill-input" id="fillIn" spellcheck="false" autocomplete="off">${step.after}</div>
      <div class="task-actions"><button class="btn primary" id="fillCheck">Check</button></div>
      <div class="feedback" id="fb"></div>${hintUI}</div>`;
    if(step.key) html += `<div class="key-point">🧠 <strong>Mental model：</strong>${step.key}</div>`;
    html += navHTML(li, si, false);
    stepContent.innerHTML = html;
    wireHint(step);
    let done = false;
    const check = () => {
      if(done) return;
      const inp = document.getElementById("fillIn");
      const fb = document.getElementById("fb");
      const v = inp.value.trim().toLowerCase();
      if(accepts.map(a => a.toLowerCase()).includes(v)){
        done = true;
        inp.disabled = true;
        showOk(fb, step.explain);
        finishStep();
      } else {
        inp.classList.remove("bad"); void inp.offsetWidth; inp.classList.add("bad");
        fb.className = "feedback show no";
        fb.innerHTML = "<strong>❌ Not quite.</strong> 想想这个空缺的「角色」是什么——是程序名？文件夹名？还是选项？(按 Hint 逐级提示)";
      }
    };
    document.getElementById("fillCheck").addEventListener("click", check);
    document.getElementById("fillIn").addEventListener("keydown", e => { if(e.key === "Enter") check(); });
  }

  /* ---- clickmap：点击界面元素逐层解剖 ---- */
  if(step.type === "clickmap"){
    const zones = step.zones.map((z, i) =>
      `<button class="cm-zone" data-i="${i}" style="left:${z.x}%;top:${z.y}%;width:${z.w}%;height:${z.h}%" title="点击解剖这一块"></button>`).join("");
    html += `<div class="card">${step.intro}</div>
      <div class="clickmap-wrap">${step.svg}${zones}</div>
      <div class="cm-info" id="cmInfo"><span style="color:var(--dim)">👆 点击图中闪烁感应区，逐块解剖这个窗口（${step.zones.length} 块）</span></div>
      <div class="cm-progress" id="cmProg">已解剖 0 / ${step.zones.length}</div>
      <div style="margin-top:10px"><button class="btn success" id="cmDone" disabled>Got it — Continue →</button></div>`;
    if(step.key) html += `<div class="key-point">🧠 <strong>Mental model：</strong>${step.key}</div>`;
    html += navHTML(li, si, false);
    stepContent.innerHTML = html;
    const visited = new Set();
    stepContent.querySelectorAll(".cm-zone").forEach(z => z.addEventListener("click", () => {
      const i = Number(z.dataset.i);
      visited.add(i);
      stepContent.querySelectorAll(".cm-zone").forEach(zz => zz.classList.toggle("active", zz === z));
      z.classList.add("visited");
      const info = step.infos[i];
      document.getElementById("cmInfo").innerHTML = `<h4>${info.h}<span class="cm-tag">${info.tag}</span></h4>${info.p}`;
      document.getElementById("cmProg").textContent = "已解剖 " + visited.size + " / " + step.zones.length;
      if(visited.size === step.zones.length) document.getElementById("cmDone").disabled = false;
    }));
    document.getElementById("cmDone").addEventListener("click", () => {
      const b = document.getElementById("cmDone");
      if(b.disabled) return;
      b.disabled = true; b.textContent = "✓ Done";
      finishStep();
    });
  }

  if(step.type === "terminal"){
    html += `
      <div class="task-card">
        <span class="task-tag">TASK CARD</span>
        <p><strong>🎯 Goal:</strong> ${step.goal}</p>
        <p><strong>📖 Background:</strong> ${step.background}</p>
        <div class="task-actions">
          <button class="btn" id="hintBtn">💡 Hint</button>
          <button class="btn" id="answerBtn">👀 Show Answer</button>
        </div>
        <div class="hint-box" id="hintBox"></div>
        <div class="answer-box" id="answerBox"></div>
      </div>
      <div id="terminalSuccess" style="display:none"></div>`;
    html += navHTML(li, si, false);
    stepContent.innerHTML = html;

    let hintLevel = 0;
    const hintBox = document.getElementById("hintBox");
    const answerBox = document.getElementById("answerBox");
    document.getElementById("hintBtn").addEventListener("click", () => {
      if(hintLevel < step.hints.length){
        hintBox.classList.add("show");
        hintBox.innerHTML = `<strong>Hint ${hintLevel + 1}/${step.hints.length}:</strong> ${step.hints[hintLevel]}`;
        hintLevel++;
      } else {
        hintBox.innerHTML = `<strong>No more hints.</strong> You can reveal the answer — but try typing it yourself first. Typing IS the learning.`;
      }
    });
    document.getElementById("answerBtn").addEventListener("click", () => {
      answerBox.classList.add("show");
      answerBox.innerHTML = `<strong>Answer:</strong> ${step.hints[step.hints.length - 1]}<br>⚠️ Don't just copy-paste — after it runs, read "What's happening inside the computer?" carefully. That's the point.`;
    });

    currentTerminalValidator = (result) => {
      if(!step.validate(result, term)) return;
      if(currentTerminalValidator === null) return;
      currentTerminalValidator = null;
      markStepDone(li, si);
      const box = document.getElementById("terminalSuccess");
      let inner = `<div class="good"><strong>🎉 Task complete!</strong> ${step.success || ""}</div>`;
      if(step.beforeAfter){
        inner += `<div class="ba">
          <div class="ba-box"><div class="ba-label">BEFORE</div>Your location:<br>${esc(step.beforeAfter.before)}</div>
          <div class="ba-arrow">→</div>
          <div class="ba-box after"><div class="ba-label">AFTER</div>Your location:<br>${esc(step.beforeAfter.after)}</div>
        </div>
        <div class="key-point">${step.beforeAfter.note}</div>`;
      }
      if(step.breakdown){
        inner += `<div class="card"><h3>🔍 Command Breakdown</h3><div class="breakdown">` +
          step.breakdown.map(b => `<div class="bd-part"><span class="bd-token">${esc(b.token)}</span><span class="bd-body"><span class="bd-label">${esc(b.label)}</span>${b.text}</span></div>`).join("") +
          `</div></div>`;
      }
      inner += `<div class="card"><h3>🖥️ What's happening inside the computer?</h3><p>${step.internals}</p></div>`;
      box.innerHTML = inner;
      box.style.display = "block";
      const nx = document.getElementById("navNext");
      nx.disabled = false; nx.classList.add("primary");
      box.scrollIntoView({ behavior: "smooth", block: "nearest" });
    };
    termInput.focus();
  }

  wireNav(li, si);
  renderSidebar();
}

/* ---------- 文件树（可交互） ---------- */
function buildFileTree(container, node, pathArr){
  const names = Object.keys(node);
  const dirs = names.filter(n => node[n] !== null).sort();
  const files = names.filter(n => node[n] === null).sort();
  dirs.concat(files).forEach(name => {
    const isDir = node[name] !== null;
    const row = document.createElement("div");
    row.className = isDir ? "ft-dir collapsed" : "ft-file";
    row.innerHTML = `<span class="ft-ico">${isDir ? "📁" : "📄"}</span><span>${esc(name)}${isDir ? "\\" : ""}</span>`;
    container.appendChild(row);
    if(isDir){
      const kids = document.createElement("div");
      kids.className = "ft-children";
      row.appendChild(kids);
      buildFileTree(kids, node[name], pathArr.concat(name));
      row.addEventListener("click", (e) => {
        if(e.target.closest(".ft-children") && e.target.closest(".ft-dir") !== row) return;
        row.classList.toggle("collapsed");
        row.querySelector(".ft-ico").textContent = row.classList.contains("collapsed") ? "📁" : "📂";
      });
    }
  });
}

/* ---------- Learning Assistant（Question Box · Phase 1 内置引导模式） ----------
   定位：不是「问什么给完整答案」，而是 Hint → 引导问题 → （可选）完整答案。
   Phase 2（部署后）：把 learningAssistant() 的内部换成对代理 API 的 fetch 调用即可，
   界面与数据格式不用改。 */
function learningAssistant(levelId, q){
  const s = q.toLowerCase();
  const has = (...ws) => ws.some(w => s.includes(w));
  if(has("wsl", "/mnt", "linux", "ubuntu")){
    return {
      hint: "WSL is a real Linux running inside Windows. Linux has <strong>no drive letters</strong> (no C:) — it sees Windows drives as folders mounted under <span class='term-inline'>/mnt</span>.",
      question: "Inside WSL, run <span class='term-inline'>pwd</span>. Does the path start with <span class='term-inline'>/</span> or with a drive letter? What does that tell you about whose rules are in effect?",
      spoiler: "Windows gives each drive a letter (C:\\, D:\\). Linux uses one unified tree starting at <span class='term-inline'>/</span>. WSL mounts your Windows C: drive at <span class='term-inline'>/mnt/c</span>, so C:\\Users\\YOGA becomes /mnt/c/Users/YOGA. Same files — two different addressing systems. (Level 21 covers WSL in depth.)"
    };
  }
  if(has("absolute", "relative", "相对", "绝对")){
    return {
      hint: "An absolute path is a complete address from the drive root; a relative path is a set of directions from <em>where you currently stand</em>.",
      question: "If you're in C:\\Users\\YOGA and type <span class='term-inline'>cd Documents</span> — is <span class='term-inline'>Documents</span> absolute or relative? Would it mean the same thing if you were in C:\\?",
      spoiler: "<span class='term-inline'>Documents</span> is relative — it means \"the Documents folder inside my current folder\". From C:\\ it would point to C:\\Documents, which doesn't exist. Absolute paths work from anywhere; relative paths depend on the current directory."
    };
  }
  if(has("环境变量", "environment", "path 是", "what is path", "what's path", "path?")){
    return {
      hint: "Think about what happened when you typed <span class='term-inline'>git</span> or <span class='term-inline'>latex --version</span> in PowerShell. You did NOT type a full address like C:\\...\\git.exe.",
      question: "So why doesn't the terminal need the full path to git.exe? Where could it be getting the list of folders to search?",
      spoiler: "PATH is an environment variable: a list of folders the shell searches, in order, whenever you type a program name. git.exe lives in one of those folders, so typing <span class='term-inline'>git</span> is enough. Levels 6–7 build this mental model properly."
    };
  }
  if(has("cd ", "cd,", "move", "移动")){
    return {
      hint: "Remember: <span class='term-inline'>cd</span> changes exactly one thing — the terminal's internal \"current directory\" note.",
      question: "After <span class='term-inline'>cd Documents</span>, if a second terminal window lists your home folder, is notes.txt still there? What does that tell you about whether any file moved?",
      spoiler: "Nothing moved. cd only rewrites the terminal's own record of where you stand. The file tree on disk is untouched — that's why pwd/ls behave differently afterwards while your files stay put."
    };
  }
  if(has("terminal", "shell")){
    return {
      hint: "Terminal = the window. Shell = the program inside the window that reads and interprets your commands. Related, but not the same thing.",
      question: "PowerShell and CMD can run inside the same terminal window app. So which one decides what <span class='term-inline'>ls</span> does — the window, or the shell program inside it?",
      spoiler: "The shell. The terminal is just a text window; the shell interprets commands. PowerShell, CMD and Bash are different shells with different vocabularies — Levels 4–5 cover this family tree with a diagram."
    };
  }
  const rv = REVIEWS[levelId];
  return {
    hint: "Good question. Before I answer — re-read the Key Concepts card and the mental-model line at the top of this review page.",
    question: "Which concept from this level does your question touch? Try explaining it in one sentence yourself first, then ask again and include your sentence.",
    spoiler: (rv && rv.concepts.length) ? "This level's core ideas, one line each:<br>• " + rv.concepts.join("<br>• ") : ""
  };
}

/* ---------- 复习总结页（Review） ---------- */
function renderReview(li){
  const level = LEVELS[li];
  const rv = REVIEWS[level.id] || {};
  terminalDock.classList.add("hidden");
  currentTerminalValidator = null;
  const hasNext = li + 1 < LEVELS.length;
  const termsRows = (rv.terms || []).map(t =>
    `<tr><td class="en">${esc(t.en)}</td><td>${esc(t.zh)}${t.ex ? `<br><span style="color:var(--dim);font-size:12px">${esc(t.ex)}</span>` : ""}</td></tr>`).join("");
  const cmdRows = (rv.commands || []).map(c =>
    `<tr><td>${esc(c.cmd)}</td><td>${esc(c.en)}</td><td>${esc(c.zh)}</td></tr>`).join("");
  const mistakeItems = (rv.mistakes || []).map(m => `<li>${m}</li>`).join("");
  const conceptItems = (rv.concepts || []).map(c => `<li>${c}</li>`).join("");
  const quizzes = (rv.quiz || []).map((q, qi) => `
    <div class="card" style="margin-bottom:12px"><strong style="font-size:14px">Quiz ${qi + 1}: </strong>${q.q}
      <div class="opt-list" style="margin-top:10px">${q.options.map((o, oi) =>
        `<button class="opt" data-q="${qi}" data-i="${oi}"><span class="opt-key">${"ABCD"[oi]}</span><span>${o.t}</span></button>`).join("")}</div>
      <div class="feedback" id="rq-${qi}"></div>
    </div>`).join("");
  stepContent.innerHTML = `
    <div class="step-kicker">Level ${level.id} · REVIEW</div>
    <h2 class="step-title">🏅 Level ${level.id} Complete: ${esc(level.title)}</h2>
    <div class="good" style="margin-bottom:4px">🧠 Core mental model of this level: ${level.summary}</div>
    <div class="review-grid">
      <div class="card"><h3>📌 Key Concepts</h3><ul>${conceptItems || "<li>见上。</li>"}</ul></div>
      <div class="card"><h3>⚠️ Common Mistakes</h3><ul>${mistakeItems || "<li>—</li>"}</ul></div>
    </div>
    ${cmdRows ? `<div class="card"><h3>⌨️ Commands to Remember</h3><table class="cmd-table"><tr><th>命令</th><th>英文全称</th><th>作用</th></tr>${cmdRows}</table></div>` : ""}
    ${termsRows ? `<div class="card"><h3>🔤 Key Terms (auto-added to your Glossary)</h3><table class="term-table">${termsRows}</table></div>` : ""}
    ${quizzes ? `<h2 class="step-title" style="font-size:19px;margin-top:22px">✏️ Quick Self-Test</h2>` + quizzes : ""}
    <div class="card" style="margin-top:18px">
      <h3>🙋 Ask about this Level</h3>
      <p style="color:var(--dim);font-size:13px">Ask in English or Chinese. The assistant gives a hint and a guiding question first — the full answer stays hidden until you ask for it. 它会先给提示和引导问题，完整答案默认折叠。</p>
      <textarea id="qaInput" rows="2" placeholder="e.g. Why is a Windows path C:\Users\YOGA but /mnt/c/Users/YOGA in WSL?" style="width:100%;background:#010409;border:1px solid var(--border);border-radius:10px;color:var(--text);padding:10px 12px;font-size:14px;font-family:inherit;resize:vertical"></textarea>
      <div style="margin-top:10px"><button class="btn primary" id="qaAsk">Ask</button></div>
      <div id="qaOut" style="margin-top:12px"></div>
    </div>
    <div class="step-nav">
      <button class="btn" id="reviewReplay">↺ Practice Again</button>
      <button class="btn" id="reviewBack">Back to Learning</button>
      <button class="btn success" id="reviewNext" style="font-size:15px;padding:12px 22px">${hasNext ? `Start Level ${LEVELS[li + 1].id}: ${esc(LEVELS[li + 1].title)} →` : "Course Summary"}</button>
    </div>`;
  stepContent.querySelectorAll(".opt").forEach(btn => {
    btn.addEventListener("click", () => {
      const qi = Number(btn.dataset.q), oi = Number(btn.dataset.i);
      const q = rv.quiz[qi], fb = document.getElementById("rq-" + qi);
      if(q.options[oi].ok){
        btn.classList.add("correct");
        btn.parentElement.querySelectorAll(".opt").forEach(b => b.disabled = true);
        fb.className = "feedback show ok";
        fb.innerHTML = "✅ Correct! " + (q.options[oi].why || "");
      } else {
        btn.classList.add("wrong");
        btn.disabled = true;
        fb.className = "feedback show no";
        fb.innerHTML = "❌ Not quite. " + (q.options[oi].why || "Check the summary above and try again.");
      }
    });
  });
  document.getElementById("reviewReplay").addEventListener("click", () => {
    store.level = li; store.step = 0; delete store.completed[li]; saveStore(); resetTerminal(true); render();
  });
  document.getElementById("reviewBack").addEventListener("click", () => { render(); });
  document.getElementById("reviewNext").addEventListener("click", () => {
    if(hasNext){ store.level = li + 1; store.step = 0; saveStore(); render(); }
    else renderCourseEnd();
  });
  const qaAsk = document.getElementById("qaAsk");
  if(qaAsk){
    const fireQuestion = () => {
      const q = document.getElementById("qaInput").value.trim();
      if(!q) return;
      const r = learningAssistant(level.id, q);
      document.getElementById("qaOut").innerHTML =
        `<div class="good" style="text-align:left">💡 <strong>Hint:</strong> ${r.hint}<br><br>🤔 <strong>Think about it:</strong> ${r.question}</div>` +
        (r.spoiler ? `<details style="margin-top:8px"><summary style="cursor:pointer;color:var(--dim);font-size:13px">📝 Show full answer · 看完整答案</summary><div class="card" style="margin-top:8px"><p>${r.spoiler}</p></div></details>` : "") +
        `<p style="color:var(--dim);font-size:11px;margin-top:8px">Phase 1 · built-in guide mode — a real AI answer engine connects after deployment.</p>`;
    };
    qaAsk.addEventListener("click", fireQuestion);
    document.getElementById("qaInput").addEventListener("keydown", (e) => { if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); fireQuestion(); } });
  }
  stepContent.scrollTop = 0;
  renderSidebar();
}

function renderCourseEnd(){
  terminalDock.classList.add("hidden");
  stepContent.innerHTML = `
    <div class="complete-hero">
      <div class="big">🎓</div>
      <h2>All available levels complete! 🎓</h2>
      <p>You've built mental models from computer basics all the way to command anatomy — Terminal vs Shell vs OS, and how to read any command.<br><br>
      你已经建立了前四个 mental model。这个项目是你的「计算机基础训练场」——左侧 🗺️ Roadmap 里有 Module A～I 的完整规划，会按依赖关系逐批更新。</p>
      <button class="btn" id="backToStart">↺ Review from Level 0</button>
    </div>`;
  document.getElementById("backToStart").addEventListener("click", () => {
    store.level = 0; store.step = 0; saveStore(); render();
  });
}

/* ---------- 进度架构（v1.1）：Progress 与 Access 分离 ----------
   store.completed[li] = 该关已完成的最大步骤下标（schema 未变，旧数据兼容）。
   课程级访问完全开放；关内线性推进由「跳转到第一个未完成步骤」保证。 */
function levelProgress(i){
  const l = LEVELS[i];
  const doneCount = Math.min(store.completed[i] != null ? store.completed[i] + 1 : 0, l.steps.length);
  return { doneCount, pct: Math.round(doneCount / l.steps.length * 100), complete: doneCount === l.steps.length };
}
function levelStepDotsHTML(li){
  const l = LEVELS[li];
  const pr = levelProgress(li);
  // 当前关高亮 store.step（正在看的位置）；其他关高亮「下一个待学步骤」
  const cur = pr.complete ? -1 : (li === store.level ? Math.min(store.step, l.steps.length - 1) : pr.doneCount);
  let h = '<span class="lv-dots" title="steps are linear within a level">';
  for(let i = 0; i < l.steps.length; i++){
    const cls = i < pr.doneCount ? "d-done" : (i === cur ? "d-cur" : "d-todo");
    h += `<span class="lv-dot ${cls}">${i < pr.doneCount ? "✓" : (i === cur ? "→" : "·")}</span>`;
  }
  return h + "</span>";
}

/* ---------- 侧边栏 ---------- */
function renderSidebar(){
  const list = document.getElementById("levelList");
  let h = "";
  let lastMod = null;
  LEVELS.forEach((l, i) => {
    if(l.module && l.module !== lastMod){ lastMod = l.module; h += `<div class="mod-header">${esc(l.module)}</div>`; }
    const pr = levelProgress(i);
    const cur = i === store.level;
    const status = pr.complete ? "completed" : (pr.pct > 0 ? "in progress" : "not started");
    h += `<div class="level-item ${pr.complete ? "done" : ""} ${cur ? "current active" : ""}" data-i="${i}">
      <button class="lv-main" data-i="${i}">
      <span class="lv-badge">${pr.complete ? "✓" : l.id}</span>
      <span class="lv-title-wrap"><span class="lv-title">Level ${l.id} · ${esc(l.title)}</span><br>
      <span class="lv-en">${esc(l.en)} · ${status}</span><br>
      ${levelStepDotsHTML(i)}</span>
      <span class="lv-pct">${pr.pct}%</span>
      </button>
      <span class="lv-sidebtns">${pr.complete ? `<button class="lv-mini" data-review="${i}" title="Review this level">📖</button>` : ""}<button class="lv-mini" data-reset="${i}" title="Reset this level">↺</button></span>
    </div>`;
  });
  list.innerHTML = h;
  // 课程级访问完全开放：点击 = 跳到该关第一个未完成步骤（已完成 → 直接进 Review）
  list.querySelectorAll(".lv-main").forEach(btn => {
    btn.addEventListener("click", () => {
      const i = Number(btn.dataset.i);
      const pr = levelProgress(i);
      store.level = i;
      saveStore(); closeSide();
      if(pr.complete){ renderReview(i); }
      else { store.step = Math.min(pr.doneCount, LEVELS[i].steps.length - 1); saveStore(); render(); }
    });
  });
  list.querySelectorAll(".lv-mini[data-review]").forEach(btn => {
    btn.addEventListener("click", (e) => { e.stopPropagation(); closeSide(); renderReview(Number(btn.dataset.review)); });
  });
  list.querySelectorAll(".lv-mini[data-reset]").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const i = Number(btn.dataset.reset);
      if(!confirm(`Reset progress of Level ${LEVELS[i].id} (${LEVELS[i].title})? Other levels are not affected.`)) return;
      delete store.completed[i];
      if(store.level === i) store.step = 0;
      saveStore(); resetTerminal(true); render();
    });
  });
  const pct = Math.round(completedCount() / totalSteps() * 100);
  document.getElementById("progressFill").style.width = pct + "%";
  document.getElementById("progressText").textContent = pct + "%";
}

/* ---------- Debug Mode（隐藏入口：Ctrl+Shift+D，不影响普通用户） ---------- */
function renderDebug(){
  const html = `<p style="color:var(--dim);font-size:13px;margin-bottom:12px">🛠 Debug tools for development. Entry: <span class="term-inline">Ctrl+Shift+D</span>. Normal users never see this unless they press it.</p>` +
    LEVELS.map((l, i) => {
      const pr = levelProgress(i);
      return `<div class="mod-item"><div class="mod-head"><span class="mod-name">Level ${l.id} · ${esc(l.title)}</span><span class="mod-status">${pr.doneCount}/${l.steps.length} steps</span></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px">
        <button class="btn" data-dbg="jump" data-i="${i}">Jump to level</button>
        <button class="btn" data-dbg="complete" data-i="${i}">Mark 100%</button>
        <button class="btn" data-dbg="clear" data-i="${i}">Reset level</button>
      </div></div>`;
    }).join("") +
    `<div style="margin-top:10px"><button class="btn" data-dbg="wipe">Wipe ALL progress</button></div>`;
  openOverlay("🛠 Debug Mode", html);
  document.getElementById("overlayBody").querySelectorAll("[data-dbg]").forEach(btn => {
    btn.addEventListener("click", () => {
      const act = btn.dataset.dbg, i = Number(btn.dataset.i);
      if(act === "jump"){ store.level = i; store.step = Math.min(levelProgress(i).doneCount, LEVELS[i].steps.length - 1); }
      if(act === "complete"){ store.completed[i] = LEVELS[i].steps.length - 1; store.level = i; store.step = 0; }
      if(act === "clear"){ delete store.completed[i]; if(store.level === i) store.step = 0; }
      if(act === "wipe"){ if(confirm("Wipe ALL progress?")){ store = { level: 0, step: 0, completed: {} }; } }
      saveStore(); resetTerminal(true); closeOverlay(); render();
    });
  });
}
document.addEventListener("keydown", (e) => {
  if(e.ctrlKey && e.shiftKey && (e.key === "D" || e.key === "d")){ e.preventDefault(); renderDebug(); }
});

document.getElementById("resetAll").addEventListener("click", () => {
  if(confirm("Reset ALL learning progress and start over from Level 0?")){
    store = { level: 0, step: 0, completed: {} };
    saveStore(); resetTerminal(true); render();
  }
});

/* ---------- 移动端抽屉 ---------- */
const sidebar = document.getElementById("sidebar");
const backdrop = document.getElementById("backdrop");
function closeSide(){ sidebar.classList.remove("open"); backdrop.classList.remove("show"); }
document.getElementById("menuBtn").addEventListener("click", () => {
  sidebar.classList.add("open"); backdrop.classList.add("show");
});
backdrop.addEventListener("click", closeSide);

/* ---------- 路线图 / 术语本 ---------- */
document.getElementById("roadmapBtn").addEventListener("click", () => {
  const html = ROADMAP.map(m => {
    const available = m.levels.some(id => LEVELS.some(l => l.id === id));
    return `<div class="mod-item ${available ? "available" : ""}">
      <div class="mod-head"><span class="mod-name">Module ${m.mod} · ${esc(m.name)}</span><span class="mod-status">${available ? "✅ Open" : "🚧 Coming soon"}</span></div>
      <div class="mod-levels">${esc(m.desc)}</div></div>`;
  }).join("") + `<p style="color:var(--dim);font-size:12px;margin-top:6px">💡 定位说明：电脑基础内容服务于两个核心模块——Command Line 与 Git/GitHub，按依赖关系逐批解锁；不追求「电脑维修大全」，目标是 Programming Environment Literacy。</p>`;
  openOverlay("🗺️ Roadmap · 课程路线图", html);
});
document.getElementById("glossaryBtn").addEventListener("click", () => {
  let rows = "";
  LEVELS.forEach(l => {
    const rv = REVIEWS[l.id];
    if(rv && rv.terms) rv.terms.forEach(t => {
      rows += `<tr><td class="en">${esc(t.en)}</td><td>${esc(t.zh)}</td><td style="color:var(--dim)">${esc(t.ex || "")}</td></tr>`;
    });
  });
  openOverlay("📖 Glossary · 术语本 (grows with your progress)",
    `<p style="color:var(--dim);font-size:13px;margin-bottom:12px">Your CS course is bilingual — start getting comfortable reading English terms. You'll see messages like <em>command not found</em> and <em>path does not exist</em> almost every day.</p><table class="term-table">${rows}</table>`);
});
document.getElementById("overlayClose").addEventListener("click", closeOverlay);
document.getElementById("overlay").addEventListener("click", (e) => { if(e.target.id === "overlay") closeOverlay(); });

/* ---------- 进度导出 / 导入（跨设备手动同步） ---------- */
document.getElementById("exportBtn").addEventListener("click", () => {
  const data = { app: "cf-playground", version: 1, savedAt: new Date().toISOString(), progress: store };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "cf-playground-progress.json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});
document.getElementById("importBtn").addEventListener("click", () => document.getElementById("importFile").click());
document.getElementById("importFile").addEventListener("change", (e) => {
  const f = e.target.files[0];
  if(!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try{
      const data = JSON.parse(rd.result);
      const p = data.progress || data;
      if(p && typeof p === "object" && typeof p.level === "number" && p.completed && typeof p.completed === "object"){
        store = { level: p.level, step: p.step || 0, completed: p.completed };
        saveStore(); resetTerminal(true); render();
        alert("✅ Progress imported. Keep going!");
      } else { alert("This file is not a progress file for this course."); }
    }catch(err){ alert("Import failed: the file is not valid JSON."); }
  };
  rd.readAsText(f);
  e.target.value = "";
});

/* ---------- 中文按需显示（全局开关，独立于进度存储） ---------- */
(function(){
  const btn = document.getElementById("zhToggle");
  if(!btn) return;
  try{ if(localStorage.getItem("cf-show-zh") === "1"){ document.body.classList.add("show-zh"); btn.textContent = "💡 中文 ✓"; } }catch(e){}
  btn.addEventListener("click", () => {
    document.body.classList.toggle("show-zh");
    const on = document.body.classList.contains("show-zh");
    btn.textContent = on ? "💡 中文 ✓" : "💡 中文";
    try{ localStorage.setItem("cf-show-zh", on ? "1" : "0"); }catch(e){}
  });
})();

/* ---------- 启动 ---------- */
try {
  resetTerminal(true);
  render();
} catch(e){
  // 最后防线：任何启动错误都重置进度保页面可用，绝不留白屏
  try { console.error("Startup render failed, resetting progress:", e); } catch(_){}
  store = { level: 0, step: 0, completed: {} };
  saveStore();
  resetTerminal(true);
  render();
}

/* ---------- E2E 测试钩子（仅 ?e2e 时暴露，正常用户不可见、无影响） ---------- */
if(location.search.indexOf("e2e") !== -1){
  window.__e2e = { LEVELS, REVIEWS, ROADMAP, getStep: () => LEVELS[store.level].steps[store.step] };
}
