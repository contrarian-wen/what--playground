<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0d1117">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<title>Computer Fundamentals Playground · 计算机基础训练场</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --border:#2d333f;
  --text:#e6edf3; --dim:#9aa7b4; --accent:#58a6ff; --green:#3fb950; --red:#f85149; --yellow:#d29922; --purple:#bc8cff;
  --mono:"Cascadia Code","JetBrains Mono",Consolas,"Courier New",monospace;
}
html,body{height:100%}
body{font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
#app{display:flex;height:100vh}

/* ============ 侧边栏 ============ */
aside{width:300px;min-width:300px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto}
.brand{padding:18px 16px 12px;border-bottom:1px solid var(--border)}
.brand h1{font-size:15px;line-height:1.5}
.brand .sub{font-size:12px;color:var(--dim);margin-top:4px}
.progress-wrap{padding:14px 16px 6px}
.progress-label{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-bottom:6px}
.progress{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden;border:1px solid var(--border)}
#progressFill{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--green));transition:width .4s ease;border-radius:99px}
#levelList{flex:1;padding:8px 8px 16px}
.level-item{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:none;border:none;color:var(--text);padding:10px;border-radius:10px;cursor:pointer;font-size:13px;line-height:1.45}
.level-item:hover{background:var(--panel2)}
.level-item.active{background:var(--panel2);outline:1px solid var(--accent)}
.level-item.locked{opacity:.42;cursor:not-allowed}
.level-item .lv-badge{min-width:26px;height:26px;border-radius:8px;background:var(--panel2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;font-family:var(--mono);flex-shrink:0}
.level-item.done .lv-badge{background:rgba(63,185,80,.15);border-color:var(--green);color:var(--green)}
.level-item.current .lv-badge{background:rgba(88,166,255,.15);border-color:var(--accent);color:var(--accent)}
.level-item .lv-title{font-weight:600}
.level-item .lv-en{font-size:11px;color:var(--dim)}
.level-item .lv-steps{font-size:11px;color:var(--dim);margin-top:2px}
.reset-btn{margin:8px 16px 14px;padding:8px;background:none;border:1px solid var(--border);color:var(--dim);border-radius:8px;font-size:12px;cursor:pointer}
.reset-btn:hover{color:var(--red);border-color:var(--red)}

/* ============ 主区域 ============ */
main{flex:1;display:flex;flex-direction:column;min-width:0}
#stepContent{flex:1;overflow-y:auto;padding:32px 40px 24px;max-width:920px;width:100%;margin:0 auto}
.step-kicker{font-size:12px;color:var(--accent);letter-spacing:.08em;text-transform:uppercase;font-weight:600;margin-bottom:6px}
.step-kicker .sep{color:var(--dim);margin:0 6px}
h2.step-title{font-size:24px;margin-bottom:20px;line-height:1.35}
.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:20px 22px;margin-bottom:16px}
.card h3{font-size:15px;margin-bottom:10px;color:var(--accent)}
.card p{font-size:14px;line-height:1.8;margin-bottom:8px;color:var(--text)}
.card p:last-child{margin-bottom:0}
.card ul,.card ol{margin:6px 0 8px 22px;font-size:14px;line-height:1.9}
.card li{margin-bottom:4px}
.card .en{color:var(--dim);font-size:.9em}
.term-inline{font-family:var(--mono);background:#010409;border:1px solid var(--border);border-radius:6px;padding:1px 7px;font-size:.92em;color:#a5d6ff;white-space:nowrap}
.key-point{border-left:3px solid var(--yellow);background:rgba(210,153,34,.07);padding:12px 16px;border-radius:0 10px 10px 0;margin:14px 0;font-size:14px;line-height:1.8}
.key-point strong{color:var(--yellow)}
.good{border-left:3px solid var(--green);background:rgba(63,185,80,.07);padding:12px 16px;border-radius:0 10px 10px 0;margin:14px 0;font-size:14px;line-height:1.8}

/* 术语 tooltip */
.term{border-bottom:1px dashed var(--accent);cursor:help;position:relative;color:var(--accent)}
.term:hover::after{content:attr(data-tip);position:absolute;left:0;bottom:calc(100% + 8px);background:#010409;border:1px solid var(--border);color:var(--text);font-size:12px;line-height:1.6;padding:10px 12px;border-radius:10px;width:280px;z-index:50;white-space:normal;font-weight:normal;box-shadow:0 8px 24px rgba(0,0,0,.5)}

/* 示意图 */
.diagram{background:#010409;border:1px solid var(--border);border-radius:14px;padding:22px;margin-bottom:16px;overflow-x:auto}
.diagram svg{display:block;margin:0 auto;max-width:100%}
.diagram .cap{text-align:center;color:var(--dim);font-size:12px;margin-top:10px}

/* 预测 / 测验选项 */
.predict-scenario{font-size:14px;line-height:1.8;margin-bottom:14px}
.opt-list{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:12px;padding:14px 16px;font-size:14px;line-height:1.7;cursor:pointer;font-family:inherit}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .opt-key{min-width:24px;height:24px;border-radius:6px;background:var(--panel);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;flex-shrink:0;margin-top:1px}
.opt.correct{border-color:var(--green);background:rgba(63,185,80,.08)}
.opt.correct .opt-key{background:var(--green);border-color:var(--green);color:#04140a}
.opt.wrong{border-color:var(--red);background:rgba(248,81,73,.08);animation:shake .3s}
.opt.wrong .opt-key{background:var(--red);border-color:var(--red);color:#fff}
.opt:disabled{cursor:default;opacity:.85}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.feedback{margin-top:14px;border-radius:12px;padding:14px 16px;font-size:14px;line-height:1.8;display:none}
.feedback.show{display:block}
.feedback.ok{background:rgba(63,185,80,.08);border:1px solid rgba(63,185,80,.4)}
.feedback.no{background:rgba(248,81,73,.08);border:1px solid rgba(248,81,73,.4)}

/* before / after */
.ba{display:flex;gap:14px;align-items:stretch;margin:14px 0;flex-wrap:wrap}
.ba .ba-box{flex:1;min-width:220px;background:#010409;border:1px solid var(--border);border-radius:12px;padding:14px 16px;font-family:var(--mono);font-size:13px;line-height:1.9}
.ba .ba-box .ba-label{font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.ba .ba-box.after{border-color:var(--green)}
.ba .ba-arrow{align-self:center;color:var(--dim);font-size:20px}

/* 任务卡 */
.task-card{background:linear-gradient(135deg,rgba(88,166,255,.08),rgba(188,140,255,.05));border:1px solid rgba(88,166,255,.35);border-radius:14px;padding:18px 20px;margin-bottom:14px}
.task-card .task-tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.1em;color:#04140a;background:var(--accent);border-radius:6px;padding:2px 8px;margin-bottom:10px}
.task-card p{font-size:14px;line-height:1.8;margin-bottom:8px}
.task-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.btn{border:1px solid var(--border);background:var(--panel2);color:var(--text);border-radius:10px;padding:9px 16px;font-size:13px;cursor:pointer;font-family:inherit}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#04140a;font-weight:600}
.btn.primary:hover{filter:brightness(1.1);color:#04140a}
.btn.success{background:var(--green);border-color:var(--green);color:#04140a;font-weight:600}
.btn.success:hover{filter:brightness(1.1);color:#04140a}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:disabled:hover{border-color:var(--border);color:var(--text)}
.hint-box{display:none;margin-top:12px;background:rgba(210,153,34,.08);border:1px solid rgba(210,153,34,.4);border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.7}
.hint-box.show{display:block}
.answer-box{display:none;margin-top:12px;background:rgba(188,140,255,.08);border:1px solid rgba(188,140,255,.4);border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.7}
.answer-box.show{display:block}
.answer-box code{font-family:var(--mono);color:var(--purple)}

/* v1.3：Level 8 新题型（multiselect / matching / ordering / fill / clickmap） */
.ms-list{display:flex;flex-direction:column;gap:8px}
.ms-opt{display:flex;gap:12px;align-items:flex-start;background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:11px 14px;font-size:14px;line-height:1.6;cursor:pointer;font-family:inherit;color:var(--text);text-align:left;width:100%}
.ms-opt:hover:not(:disabled){border-color:var(--accent)}
.ms-opt input{accent-color:var(--accent);margin-top:3px;flex-shrink:0}
.ms-opt.picked{border-color:var(--accent)}
.ms-opt.eliminated{opacity:.45;border-color:var(--red)}
.ms-opt:disabled{cursor:default}
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;align-items:center}
.match-left{font-size:14px;line-height:1.5;padding:9px 12px;background:var(--panel2);border:1px solid var(--border);border-radius:10px}
select.match-sel{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:9px 12px;font-size:13px;font-family:inherit;width:100%}
select.match-sel.bad{border-color:var(--red)}
select.match-sel.good{border-color:var(--green)}
.order-pool,.order-ans{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.order-chip{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:99px;padding:8px 16px;font-size:13px;cursor:pointer;font-family:inherit}
.order-chip:hover{border-color:var(--accent);color:var(--accent)}
.order-chip.used{opacity:.3;pointer-events:none}
.order-chip.seq{border-color:var(--accent);color:#a5d6ff}
.order-chip.seq .seq-n{color:var(--dim);margin-right:6px;font-size:11px}
.order-lane{border:1px dashed var(--border);border-radius:12px;padding:8px 12px;min-height:50px}
.order-lane-label{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.fill-line{font-family:var(--mono);font-size:15px;background:#010409;border:1px solid var(--border);border-radius:12px;padding:16px 18px;line-height:2.2;margin:10px 0;color:#e6edf3}
.fill-input{background:var(--panel2);border:1px solid var(--accent);border-radius:8px;color:var(--text);font-family:var(--mono);font-size:14px;padding:4px 12px;min-width:140px;text-align:center;outline:none}
.fill-input:focus{border-color:var(--green)}
.fill-input.bad{border-color:var(--red);animation:shake .3s}
.clickmap-wrap{position:relative;background:#010409;border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:14px}
.clickmap-wrap svg{display:block;width:100%;height:auto}
.cm-zone{position:absolute;border:1.5px dashed transparent;border-radius:8px;cursor:pointer;background:rgba(88,166,255,0)}
.cm-zone:hover{border-color:var(--accent);background:rgba(88,166,255,.10)}
.cm-zone.visited{border-color:var(--green);background:rgba(63,185,80,.08)}
.cm-zone.active{border-color:var(--yellow);background:rgba(210,153,34,.12)}
.cm-info{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px 16px;font-size:14px;line-height:1.8;min-height:64px}
.cm-info h4{color:var(--accent);font-size:14px;margin-bottom:6px}
.cm-info .cm-tag{display:inline-block;font-size:10px;letter-spacing:.08em;border:1px solid var(--yellow);color:var(--yellow);border-radius:99px;padding:1px 8px;margin-left:8px;vertical-align:2px}
.cm-progress{font-size:12px;color:var(--dim);margin-top:8px}
@media(max-width:700px){.match-grid{grid-template-columns:1fr}}

/* 命令拆解 */
.breakdown{display:grid;gap:10px;margin:12px 0}
.bd-part{display:flex;gap:12px;align-items:flex-start;background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:10px 14px}
.bd-token{font-family:var(--mono);background:#010409;border:1px solid var(--accent);color:#a5d6ff;border-radius:8px;padding:3px 10px;font-size:13px;flex-shrink:0}
.bd-body{font-size:13px;line-height:1.65}
.bd-body .bd-label{color:var(--accent);font-weight:600;display:block;margin-bottom:2px;font-size:12px}

/* 文件树（可交互） */
.filetree{font-family:var(--mono);font-size:13.5px;line-height:2;background:#010409;border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-bottom:14px;user-select:none}
.ft-dir,.ft-file{display:flex;align-items:center;gap:6px;border-radius:6px;padding:0 6px}
.ft-dir{cursor:pointer}
.ft-dir:hover{background:var(--panel2)}
.ft-children{margin-left:20px;border-left:1px dashed var(--border);padding-left:8px}
.ft-ico{width:18px;text-align:center;flex-shrink:0}
.ft-file .ft-ico{color:var(--dim)}
.collapsed>.ft-children{display:none}
.ft-note{font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:12px;color:var(--dim);margin:-6px 0 14px}

/* 完成页 */
.complete-hero{text-align:center;padding:40px 20px}
.complete-hero .big{font-size:52px;margin-bottom:10px}
.complete-hero h2{font-size:26px;margin-bottom:12px}
.complete-hero p{color:var(--dim);font-size:14px;line-height:1.8;max-width:520px;margin:0 auto 20px}

/* 步骤导航 */
.step-nav{display:flex;justify-content:space-between;align-items:center;margin-top:24px;padding-top:18px;border-top:1px solid var(--border)}
.step-dots{display:flex;gap:6px}
.dot{width:8px;height:8px;border-radius:99px;background:var(--border)}
.dot.done{background:var(--green)}
.dot.cur{background:var(--accent);width:20px}

/* ============ 终端模拟器 ============ */
#terminalDock{border-top:1px solid var(--border);background:#010409;flex-shrink:0}
#terminalDock.hidden{display:none}
.term-head{display:flex;align-items:center;gap:12px;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--border);font-size:12px;color:var(--dim)}
.term-head .term-title{font-weight:600;color:var(--text)}
.term-head .term-cwd{font-family:var(--mono);color:var(--accent)}
.term-head .spacer{flex:1}
.term-head button{background:none;border:1px solid var(--border);color:var(--dim);border-radius:6px;padding:2px 10px;font-size:11px;cursor:pointer;font-family:inherit}
.term-head button:hover{color:var(--text);border-color:var(--dim)}
#termOut{height:180px;overflow-y:auto;padding:10px 16px;font-family:var(--mono);font-size:13px;line-height:1.75}
#termOut .t-line{white-space:pre-wrap;word-break:break-all}
#termOut .t-cmd{color:var(--text)}
#termOut .t-ok{color:#a5d6ff}
#termOut .t-err{color:var(--red)}
#termOut .t-dim{color:var(--dim)}
#termOut .t-green{color:var(--green)}
.term-input-row{display:flex;align-items:center;gap:8px;padding:8px 16px 12px;font-family:var(--mono);font-size:13px}
#termPrompt{color:var(--green);white-space:nowrap}
#termInput{flex:1;background:none;border:none;outline:none;color:var(--text);font-family:var(--mono);font-size:13px;caret-color:var(--green)}
@media (max-width:860px){aside{width:230px;min-width:230px}#stepContent{padding:20px}}

/* ============ 顶栏（移动端抽屉） ============ */
#topbar{display:none;align-items:center;gap:12px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--border);flex-shrink:0}
#topbar .tb-title{font-size:14px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#menuBtn{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:8px;width:42px;height:42px;font-size:17px;cursor:pointer;flex-shrink:0}
#backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:90}
#backdrop.show{display:block}
.side-tools{display:flex;gap:6px;padding:0 16px 8px;flex-wrap:wrap}
.tool-btn{flex:1;min-width:64px;background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 4px;font-size:12px;cursor:pointer;font-family:inherit}
.tool-btn:hover{border-color:var(--accent);color:var(--accent)}
.level-item{display:flex;align-items:flex-start;gap:6px}
.lv-main{flex:1;display:flex;gap:10px;align-items:flex-start;background:none;border:none;color:var(--text);text-align:left;padding:10px;border-radius:10px;cursor:pointer;font-size:13px;line-height:1.45;font-family:inherit;min-width:0}
.lv-main:hover{background:var(--panel2)}
.level-item.active .lv-main{background:var(--panel2);outline:1px solid var(--accent)}
.lv-review{background:none;border:1px solid var(--border);border-radius:8px;cursor:pointer;padding:6px 8px;align-self:center;flex-shrink:0;font-size:13px}
.lv-review:hover{border-color:var(--green)}
/* 覆盖层（路线图 / 术语本） */
.overlay{display:none;position:fixed;inset:0;z-index:200;background:rgba(1,4,9,.72);align-items:center;justify-content:center;padding:16px}
.overlay.show{display:flex}
.overlay-card{background:var(--panel);border:1px solid var(--border);border-radius:16px;width:100%;max-width:720px;max-height:86vh;display:flex;flex-direction:column;overflow:hidden}
.overlay-head{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border)}
.overlay-head h2{font-size:17px;flex:1}
.overlay-head button{background:none;border:1px solid var(--border);color:var(--dim);border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:15px}
.overlay-body{padding:16px 18px;overflow-y:auto}
/* 复习页 */
.review-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:16px 0}
@media(max-width:700px){.review-grid{grid-template-columns:1fr}}
.review-grid .card{margin-bottom:0}
.term-table{width:100%;border-collapse:collapse;font-size:13px}
.term-table td{padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:top}
.term-table td.en{font-family:var(--mono);color:var(--accent)}
.cmd-table{width:100%;border-collapse:collapse;font-size:13px}
.cmd-table th{text-align:left;color:var(--dim);font-weight:600;padding:6px 10px;border-bottom:1px solid var(--border)}
.cmd-table td{padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:top}
.cmd-table td:first-child{font-family:var(--mono);color:#a5d6ff;white-space:nowrap}
/* 命令拆解 chips */
#dissectRow{display:none;gap:8px;align-items:flex-start;flex-wrap:wrap;padding:8px 16px 0;font-size:12px}
#dissectRow.show{display:flex}
.chip{display:inline-flex;flex-direction:column;background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:5px 12px;cursor:help}
.chip:hover{border-color:var(--accent)}
.chip .chip-tok{font-family:var(--mono);font-size:13px;color:#a5d6ff}
.chip .chip-role{font-size:10px;color:var(--dim);letter-spacing:.04em}
.chip.role-program .chip-tok{color:var(--purple)}
.chip.role-subcommand .chip-tok{color:var(--yellow)}
.chip.role-option .chip-tok{color:var(--green)}
/* 路线图 */
.mod-item{border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:var(--panel2)}
.mod-item .mod-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;gap:8px}
.mod-item .mod-name{font-weight:700;font-size:14px}
.mod-item .mod-status{font-size:11px;padding:2px 10px;border-radius:99px;border:1px solid var(--border);color:var(--dim);white-space:nowrap}
.mod-item.available .mod-status{color:var(--green);border-color:var(--green)}
.mod-item .mod-levels{font-size:12px;color:var(--dim);line-height:1.8}
/* 手机端适配 */
@media (max-width:860px){
  aside{position:fixed;left:0;top:0;bottom:0;z-index:100;transform:translateX(-105%);transition:transform .25s ease;box-shadow:0 0 40px rgba(0,0,0,.6);width:280px;min-width:280px}
  aside.open{transform:none}
  #topbar{display:flex}
  #stepContent{padding:18px 16px 20px}
  h2.step-title{font-size:20px}
  .btn,.opt{padding:14px 16px;font-size:15px}
  #termInput{font-size:16px}

<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <h1>🧠 Computer Fundamentals<br>Playground · 基础训练场</h1>

    </div>
    <div class="progress-wrap">
      <div class="progress-label"><span>Progress</span><span id="progressText">0%</span></div>
      <div class="progress"><div id="progressFill"></div></div>
    </div>
    <nav id="levelList"></nav>
    <div class="side-tools">
      <button class="tool-btn" id="roadmapBtn">🗺️ Roadmap</button>
      <button class="tool-btn" id="glossaryBtn">📖 Glossary</button>
      <button class="tool-btn" id="exportBtn">⬇ Export</button>
      <button class="tool-btn" id="importBtn">⬆ Import</button>
      <button class="tool-btn" id="zhToggle">💡 中文</button>
      <input type="file" id="importFile" accept=".json" style="display:none">
    </div>
    <button class="reset-btn" id="resetAll">↺ Reset Progress</button>
  </aside>
  <div id="backdrop"></div>
  <div class="overlay" id="overlay">
    <div class="overlay-card">
      <div class="overlay-head"><h2 id="overlayTitle"></h2><button id="overlayClose" aria-label="关闭">✕</button></div>
      <div class="overlay-body" id="overlayBody"></div>
    </div>
  </div>
  <main>
    <div id="topbar">
      <button id="menuBtn" aria-label="打开课程目录">☰</button>
      <span class="tb-title">Computer Fundamentals Playground</span>
    </div>
    <div id="stepContent"></div>
    <section id="terminalDock" class="hidden">
      <div class="term-head">
        <span class="term-title">Terminal Simulator</span>
        <span class="term-cwd" id="termCwd"></span>
        <span class="spacer"></span>
        <span>Virtual · never touches your real computer</span>
        <button id="termReset">Reset</button>
      </div>
      <div id="dissectRow"></div>
      <div id="termOut"></div>
      <div class="term-input-row">
        <span id="termPrompt"></span>
        <input id="termInput" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type a command, press Enter">
      </div>
    </section>
  </main>

<script>
"use strict";
/* ================================================================
   第一部分：纯逻辑核心（虚拟文件系统 + 终端命令引擎）
   这一部分不碰网页，负责"电脑内部"的模拟。
   ================================================================ */

// 默认虚拟文件系统：目录 = 对象，文件 = null
function createDefaultFS(){
  return {
    "C:": {
      "Windows": { "System32": {} },
      "Program Files": {
        "Git": { "cmd": { "git.exe": null } },
        "MiKTeX": { "miktex": { "bin": { "x64": { "latex.exe": null, "latexmk.exe": null } } } }
      },
      "Strawberry": { "perl": { "bin": { "perl.exe": null } } },
      "Users": {
        "YOGA": {
          "Desktop": { "VS Code.lnk": null, "回收站.lnk": null },
          "Documents": { "notes.txt": null, "数学作业.docx": null, "简历.tex": null },
          "Downloads": { "LaTeX-Workshop-2026.zip": null, "setup.exe": null },
          "Pictures": { "猫.jpg": null },
          "Music": {},
          "bin": { "hello-tool.exe": null },
          "AppData": { "Local": { "Programs": { "Python": { "Python313": { "python.exe": null } } } } },
          "hello.py": null,
          "readme.md": null
        }
      }
    }
  };
}

function createTermState(){
  return {
    cwd: ["C:", "Users", "YOGA"],
    fs: createDefaultFS(),
    // PATH 清单：shell 收到程序名时按顺序逐格搜索的文件夹（有序！）
    path: [
      "C:\\Windows\\System32",
      "C:\\Windows",
      "C:\\Program Files\\Git\\cmd",
      "C:\\Program Files\\MiKTeX\\miktex\\bin\\x64",
      "C:\\Strawberry\\perl\\bin",
      "C:\\Users\\YOGA\\AppData\\Local\\Programs\\Python\\Python313"
    ]
  };
}

function pathStr(arr){ return arr.join("\\"); }

function splitPath(arg){ return String(arg).split(/[\\/]+/).filter(Boolean); }

// 把用户输入的路径（绝对或相对）解析成从盘符开始的段数组；无法解析返回 null
function resolvePath(state, arg){
  if(typeof arg !== "string" || arg.trim() === "") return null;
  const segs = splitPath(arg.trim());
  if(segs.length === 0) return null;
  let base;
  if(/^[a-zA-Z]:$/.test(segs[0])){
    base = [];                       // 绝对路径：从盘符开始
  } else {
    base = state.cwd.slice();        // 相对路径：从当前目录开始
  }
  for(const s of segs){
    if(s === ".") continue;
    if(s === ".."){ if(base.length > 0) base.pop(); continue; }
    base.push(s);
  }
  return base;
}

function getNode(fs, pathArr){
  let node = fs;
  for(const p of pathArr){
    if(typeof node !== "object" || node === null || !(p in node)) return undefined;
    node = node[p];
  }
  return node;
}

// 极简通配符：只支持 *（任意长度）和 ?（单个字符），大小写不敏感
function globToRegExp(pattern){
  const re = String(pattern).replace(/[.+^${}()|[\]\\]/g, "\\$&").replace(/\*/g, ".*").replace(/\?/g, ".");
  return new RegExp("^" + re + "$", "i");
}
function hasGlob(s){ return typeof s === "string" && (s.indexOf("*") !== -1 || s.indexOf("?") !== -1); }

const COMMAND_INFO = {
  pwd: { en: "print working directory", zh: "打印当前工作目录 —— 回答「我现在在哪？」" },
  ls:  { en: "list", zh: "列出当前文件夹里有什么" },
  cd:  { en: "change directory", zh: "改变当前所在文件夹" },
};

// 执行一行命令，返回结果对象（不修改 DOM）
function executeCommand(state, line){
  const trimmed = line.trim();
  const result = {
    input: line, cmd: "", args: [], err: false,
    lines: [], cwdBefore: state.cwd.slice(), cwdAfter: state.cwd.slice(), resolved: null
  };
  if(trimmed === "") return result;
  // 引号感知分词：引号包住的空格内容算一个 token，引号本身被剥掉
  // 教学点：mkdir "my folder" 是一个参数，mkdir my folder 是两个
  const rawTokens = trimmed.match(/"[^"]*"|'[^']*'|\S+/g) || [];
  const tokens = rawTokens.map(t => {
    if(t.length >= 2 && ((t.charAt(0) === '"' && t.charAt(t.length - 1) === '"') || (t.charAt(0) === "'" && t.charAt(t.length - 1) === "'"))) return t.slice(1, -1);
    return t;
  });
  result.cmd = tokens[0].toLowerCase();
  result.args = tokens.slice(1);
  result.quoted = rawTokens.slice(1).map((t, i) => tokens[i + 1] !== t); // 每个参数是否曾被引号包住
  // PowerShell 原生名（Verb-Noun）映射到 Bash 风格实现：同一行为，不同名字（alias 概念）
  const PS_NATIVE = {
    "get-location":  { to: "pwd", note: "(Get-Location is PowerShell's native name; Bash calls the same behavior 'pwd')" },
    "get-childitem": { to: "ls",  note: "(Get-ChildItem is PowerShell's native name; in PowerShell even 'ls' is an alias for it)" },
    "set-location":  { to: "cd",  note: "(Set-Location is PowerShell's native name; 'cd' is an alias for it)" }
  };
  let nativeNote = "";
  if(PS_NATIVE[result.cmd]){ nativeNote = PS_NATIVE[result.cmd].note; result.cmd = PS_NATIVE[result.cmd].to; }
  const cmd = result.cmd;

  if(cmd === "pwd"){
    result.lines.push({ text: pathStr(state.cwd), cls: "t-ok" });
    if(nativeNote) result.lines.push({ text: nativeNote, cls: "t-dim" });
    return result;
  }

  if(cmd === "ls"){
    let targetPath = state.cwd, label = null;
    const nonOpt = result.args.filter(a => a.charAt(0) !== "-");
    const opts = result.args.filter(a => a.charAt(0) === "-");
    if(opts.length > 0){
      result.lines.push({ text: `（模拟器暂不支持选项 ${opts.join(" ")}——真实终端里它是「开关」：比如 -la = 详细列出 + 含隐藏文件。先按普通 ls 显示。）`, cls: "t-dim" });
    }
    if(nonOpt.length > 0 && hasGlob(nonOpt[0])){
      // 通配符模式：对当前文件夹的成员做匹配
      const cur = getNode(state.fs, state.cwd);
      const re = globToRegExp(nonOpt[0]);
      const names = Object.keys(cur).filter(n => re.test(n));
      if(names.length === 0){
        result.lines.push({ text: `ls: 当前文件夹里没有成员匹配模式“${nonOpt[0]}”。`, cls: "t-dim" });
        return result;
      }
      result.lines.push({ text: `（通配符模式 ${nonOpt[0]} 匹配到 ${names.length} 个成员）`, cls: "t-dim" });
      names.sort().forEach(n => result.lines.push({ text: cur[n] !== null ? n + "\\" : n, cls: cur[n] !== null ? "t-green" : "t-ok" }));
      return result;
    }
    if(nonOpt.length > 0){
      const r = resolvePath(state, nonOpt[0]);
      const node = r ? getNode(state.fs, r) : undefined;
      if(!r || node === undefined){
        result.err = true;
        result.lines.push({ text: `ls: 找不到路径“${nonOpt[0]}”，因为该路径不存在。`, cls: "t-err" });
        return result;
      }
      if(node === null){
        result.err = true;
        result.lines.push({ text: `ls: “${pathStr(r)}” 是一个文件，不是文件夹，没有成员可以列出。`, cls: "t-err" });
        return result;
      }
      targetPath = r; label = pathStr(r);
    }
    const node = getNode(state.fs, targetPath);
    const names = Object.keys(node);
    if(names.length === 0){
      result.lines.push({ text: "(这个文件夹是空的)", cls: "t-dim" });
    } else {
      names.sort().forEach(n => {
        const isDir = node[n] !== null;
        result.lines.push({ text: isDir ? n + "\\" : n, cls: isDir ? "t-green" : "t-ok" });
      });
    }
    if(label) result.lines.push({ text: "", cls: "t-dim" }), result.lines.push({ text: "↑ 这是 " + label + " 的内容，你的位置没有变。", cls: "t-dim" });
    return result;
  }

  if(cmd === "cd"){
    if(result.args.length === 0){
      result.err = true;
      result.lines.push({ text: "cd: 缺少目标。用法：cd <文件夹名>", cls: "t-err" });
      result.lines.push({ text: "（命令需要知道你想进入哪里）", cls: "t-dim" });
      return result;
    }
    const r = resolvePath(state, result.args[0]);
    const node = r ? getNode(state.fs, r) : undefined;
    result.resolved = r;
    if(!r || node === undefined){
      result.err = true;
      result.lines.push({ text: `cd: 找不到路径“${r ? pathStr(r) : result.args[0]}”，因为该路径不存在。`, cls: "t-err" });
      result.lines.push({ text: "提示：先用 ls 看看当前文件夹里到底有什么，检查拼写。", cls: "t-dim" });
      return result;
    }
    if(node === null){
      result.err = true;
      result.lines.push({ text: `cd: 路径“${pathStr(r)}”指向的是一个文件，不是文件夹。`, cls: "t-err" });
      result.lines.push({ text: "cd 只能进入文件夹，不能进入文件。", cls: "t-dim" });
      return result;
    }
    if(r.length >= 2 && r[0] === "C:" && r[1] === "Windows"){
      result.err = true;
      result.lines.push({ text: `cd: 访问被拒绝 (Access denied / Permission denied): ${pathStr(r)}`, cls: "t-err" });
      result.lines.push({ text: "（路径真实存在——是你的账户不被允许。Permission denied ≠ not found。需要 Administrator 权限，见 Module 06。）", cls: "t-dim" });
      return result;
    }
    state.cwd = r;
    result.cwdAfter = r.slice();
    return result;
  }

  if(cmd === "git"){
    const sub = (result.args[0] || "").toLowerCase();
    if(sub === "--version" || sub === "-v" || sub === "version"){
      result.lines.push({ text: "git version 2.47.1.windows.1", cls: "t-ok" });
      return result;
    }
    if(sub === ""){
      result.lines.push({ text: "usage: git [-v | --version] [-h | --help] <command> [<args>]", cls: "t-ok" });
      result.lines.push({ text: "(git 在等你告诉它做什么：commit? push? 子命令是 Level 8+ 的内容)", cls: "t-dim" });
      return result;
    }
    if(sub === "init"){
      // 虚拟仓库：在 cwd 建一个 .git 目录——后续 commit/status 等子命令因此「有了家」
      const cur = getNode(state.fs, state.cwd);
      if(".git" in cur){
        result.err = true;
        result.lines.push({ text: "fatal: 已经是一个 git 仓库了（.git 已存在）。", cls: "t-err" });
        return result;
      }
      cur[".git"] = {};
      result.lines.push({ text: "Initialized empty Git repository in " + pathStr(state.cwd) + "/.git/", cls: "t-green" });
      result.lines.push({ text: "(git init = 在当前文件夹建一个 .git 数据库。从此这个文件夹升级成 repository——Module 03 详解)", cls: "t-dim" });
      return result;
    }
    // 其他子命令：需要 cwd 里已有 .git（只查当前层，模拟从简）
    const curNode = getNode(state.fs, state.cwd);
    if(!(".git" in curNode)){
      result.err = true;
      result.lines.push({ text: "fatal: not a git repository (or any of the parent directories): .git", cls: "t-err" });
      result.lines.push({ text: "(致命错误：当前文件夹不是 git 仓库。git 只能在一个 repository 里工作 —— Module 03 详解。)", cls: "t-dim" });
      return result;
    }
    if(sub === "commit"){
      const msg = result.args[result.args.indexOf("-m") + 1] || "(no message)";
      result.lines.push({ text: "[main (root-commit) a1b2c3d] " + msg, cls: "t-ok" });
      result.lines.push({ text: "(模拟提交成功：git 把当前快照存进了 .git 数据库。真实的 add/commit 流程是 Module 03 的内容)", cls: "t-dim" });
      return result;
    }
    if(sub === "status"){
      result.lines.push({ text: "On branch main", cls: "t-ok" });
      result.lines.push({ text: "nothing to commit, working tree clean", cls: "t-ok" });
      result.lines.push({ text: "(模拟：仓库一切正常，没有待提交的改动)", cls: "t-dim" });
      return result;
    }
    result.lines.push({ text: "git " + sub + ": simulated OK (repository exists)", cls: "t-ok" });
    result.lines.push({ text: "(这个子命令的详细玩法属于 Module 03 Git & GitHub)", cls: "t-dim" });
    return result;
  }

  if(cmd === "mkdir"){
    if(result.args.length === 0){
      result.err = true;
      result.lines.push({ text: "mkdir: 缺少目标。用法：mkdir <文件夹名>", cls: "t-err" });
      return result;
    }
    const name = result.args[0];
    const curNode = getNode(state.fs, state.cwd);
    if(name in curNode){
      result.err = true;
      result.lines.push({ text: `mkdir: 无法创建目录“${name}”：已存在同名成员。`, cls: "t-err" });
      return result;
    }
    curNode[name] = {};
    result.lines.push({ text: `已创建文件夹 ${pathStr(state.cwd.concat(name))}\\`, cls: "t-green" });
    return result;
  }

  // ===== 文件操作：touch / cat / cp / mv / rm（在虚拟文件系统上） =====
  if(cmd === "touch"){
    const name = result.args[0];
    if(!name){
      result.err = true;
      result.lines.push({ text: "touch: 缺少目标。用法：touch <文件名>", cls: "t-err" });
      return result;
    }
    const curNode = getNode(state.fs, state.cwd);
    if(name in curNode){
      result.lines.push({ text: `${name} 已存在（真实 touch 会刷新它的时间戳）`, cls: "t-dim" });
      return result;
    }
    curNode[name] = null;
    result.lines.push({ text: `已创建空文件 ${pathStr(state.cwd.concat(name))}`, cls: "t-green" });
    return result;
  }

  if(cmd === "cat"){
    const arg = result.args[0];
    if(!arg){
      result.err = true;
      result.lines.push({ text: "cat: 缺少目标。用法：cat <文件名>", cls: "t-err" });
      return result;
    }
    const r = resolvePath(state, arg);
    const node = r ? getNode(state.fs, r) : undefined;
    if(!r || node === undefined){
      result.err = true;
      result.lines.push({ text: `cat: ${arg}: 没有那个文件或目录`, cls: "t-err" });
      return result;
    }
    if(node !== null){
      result.err = true;
      result.lines.push({ text: `cat: ${arg}: 是一个文件夹。cat 用来查看文件内容。`, cls: "t-err" });
      result.lines.push({ text: "（想列文件夹内容请用 ls）", cls: "t-dim" });
      return result;
    }
    result.lines.push({ text: `═══ ${pathStr(r)} 的内容 ═══`, cls: "t-dim" });
    result.lines.push({ text: "（模拟器不存储文件内容——真实的 cat 会把全文打印在这里）", cls: "t-dim" });
    result.lines.push({ text: "═══ 文件结束 ═══", cls: "t-dim" });
    return result;
  }

  if(cmd === "cp" || cmd === "mv"){
    if(result.args.length < 2){
      result.err = true;
      result.lines.push({ text: `${cmd}: 需要两个目标。用法：${cmd} <来源> <目标>`, cls: "t-err" });
      return result;
    }
    const rSrc = resolvePath(state, result.args[0]);
    const srcNode = rSrc ? getNode(state.fs, rSrc) : undefined;
    if(!rSrc || srcNode === undefined){
      result.err = true;
      result.lines.push({ text: `${cmd}: ${result.args[0]}: 没有那个文件或目录`, cls: "t-err" });
      return result;
    }
    const rDst = resolvePath(state, result.args[1]);
    const dstNode = rDst ? getNode(state.fs, rDst) : undefined;
    if(!rDst){
      result.err = true;
      result.lines.push({ text: `${cmd}: 无法解析目标路径“${result.args[1]}”`, cls: "t-err" });
      return result;
    }
    let finalPath = rDst;
    if(dstNode !== undefined && dstNode !== null){
      // 目标是已存在的文件夹 → 移入其中
      finalPath = rDst.concat(rSrc[rSrc.length - 1]);
      if(getNode(state.fs, finalPath) !== undefined){
        result.err = true;
        result.lines.push({ text: `${cmd}: “${pathStr(finalPath)}” 已存在。`, cls: "t-err" });
        return result;
      }
    } else if(dstNode === undefined){
      // 目标不存在 → 视为新名字；父目录必须存在
      const parent = rDst.length > 1 ? getNode(state.fs, rDst.slice(0, -1)) : undefined;
      if(parent === undefined || parent === null){
        result.err = true;
        result.lines.push({ text: `${cmd}: 目标文件夹“${pathStr(rDst.slice(0, -1))}”不存在。先 mkdir 它。`, cls: "t-err" });
        return result;
      }
    }
    if(cmd === "cp"){
      const clone = (n) => n === null ? null : Object.fromEntries(Object.entries(n).map(([k, v]) => [k, clone(v)]));
      const parentNode = getNode(state.fs, finalPath.slice(0, -1));
      parentNode[finalPath[finalPath.length - 1]] = clone(srcNode);
      result.lines.push({ text: `已复制 ${pathStr(rSrc)} → ${pathStr(finalPath)}`, cls: "t-green" });
      result.lines.push({ text: "(现在有两份：原文件没动)", cls: "t-dim" });
    } else {
      const parentNode = getNode(state.fs, finalPath.slice(0, -1));
      parentNode[finalPath[finalPath.length - 1]] = srcNode;
      if(finalPath.join("\\") !== rSrc.join("\\")){
        const srcParent = getNode(state.fs, rSrc.slice(0, -1));
        delete srcParent[rSrc[rSrc.length - 1]];
      }
      result.lines.push({ text: `已移动 ${pathStr(rSrc)} → ${pathStr(finalPath)}`, cls: "t-green" });
      result.lines.push({ text: "(原位置没有了——移动不是复制)", cls: "t-dim" });
    }
    return result;
  }

  if(cmd === "rm"){
    const flags = result.args.filter(a => a.charAt(0) === "-");
    const target = result.args.filter(a => a.charAt(0) !== "-")[0];
    if(!target){
      result.err = true;
      result.lines.push({ text: "rm: 缺少目标。用法：rm <文件名>（文件夹需 rm -r <文件夹名>）", cls: "t-err" });
      return result;
    }
    const recursive = flags.some(f => f.indexOf("r") !== -1);
    if(hasGlob(target)){
      // 通配符删除：对当前文件夹成员批量匹配（先做：含 * 的名字不会被 resolvePath 解析）
      const cur = getNode(state.fs, state.cwd);
      const re = globToRegExp(target);
      const matches = Object.keys(cur).filter(n => re.test(n));
      if(matches.length === 0){
        result.err = true;
        result.lines.push({ text: `rm: 当前文件夹里没有成员匹配模式“${target}”。`, cls: "t-err" });
        return result;
      }
      const dirs = matches.filter(n => cur[n] !== null);
      if(dirs.length > 0 && !recursive){
        result.err = true;
        result.lines.push({ text: `rm: 模式“${target}”也匹配到了文件夹（${dirs.join("、")}）——rm 拒绝直接删文件夹。`, cls: "t-err" });
        result.lines.push({ text: "缩小模式只匹配文件，或确认后用 rm -r。", cls: "t-dim" });
        return result;
      }
      matches.forEach(n => delete cur[n]);
      result.lines.push({ text: `已删除 ${matches.length} 个匹配成员：${matches.sort().join("、")}`, cls: "t-green" });
      result.lines.push({ text: "(虚拟系统里删的，别担心；真实终端里这个动作不可撤销——用通配符前先 ls 一遍模式确认会命中谁)", cls: "t-dim" });
      return result;
    }
    const r = resolvePath(state, target);
    const node = r ? getNode(state.fs, r) : undefined;
    if(!r || node === undefined){
      result.err = true;
      result.lines.push({ text: `rm: ${target}: 没有那个文件或目录`, cls: "t-err" });
      return result;
    }
    if(node !== null && !recursive){
      result.err = true;
      result.lines.push({ text: `rm: ${target}: 是一个文件夹，里面可能有重要东西。`, cls: "t-err" });
      result.lines.push({ text: "rm 拒绝直接删文件夹——确认真的要删整个文件夹时，用 rm -r（recurse，递归）。这是 rm 内置的防手滑机制。", cls: "t-dim" });
      return result;
    }
    const parent = getNode(state.fs, r.slice(0, -1));
    delete parent[r[r.length - 1]];
    result.lines.push({ text: `已删除 ${pathStr(r)}${node !== null ? "\\（整个文件夹）" : ""}`, cls: "t-green" });
    result.lines.push({ text: "(虚拟系统里删的，别担心)", cls: "t-dim" });
    return result;
  }

  if(cmd === "where"){
    const target = result.args[0];
    if(!target){
      result.err = true;
      result.lines.push({ text: "where: 缺少目标。用法：where <程序名>", cls: "t-err" });
      return result;
    }
    const exeName = target.toLowerCase().endsWith(".exe") ? target : target + ".exe";
    let found = 0;
    (state.path || []).forEach(d => {
      const node = getNode(state.fs, splitPath(d));
      if(typeof node === "object" && node !== null && exeName in node){
        result.lines.push({ text: pathStr(splitPath(d).concat(exeName)), cls: "t-ok" });
        found++;
      }
    });
    if(found === 0){
      result.err = true;
      result.lines.push({ text: "INFO: Could not find files for the given pattern(s).", cls: "t-err" });
      result.lines.push({ text: `（找遍 PATH 清单的每个文件夹，都没有 ${exeName}。程序存在于硬盘 ≠ shell 找得到 —— 它的文件夹在 PATH 里吗？）`, cls: "t-dim" });
    }
    return result;
  }

  if(cmd === "path"){
    result.lines.push({ text: "PATH=" + (state.path || []).join(";"), cls: "t-ok" });
    result.lines.push({ text: "(有序清单：shell 从左往右逐格搜索程序，先找到的优先。真实 PowerShell 里用 $env:PATH 查看。)", cls: "t-dim" });
    return result;
  }

  if(cmd === "path-add"){
    const arg = result.args[0];
    if(!arg){
      result.err = true;
      result.lines.push({ text: "path-add: 缺少目标。用法：path-add <文件夹路径>", cls: "t-err" });
      return result;
    }
    const r = resolvePath(state, arg);
    const node = r ? getNode(state.fs, r) : undefined;
    if(!r || node === undefined){
      result.err = true;
      result.lines.push({ text: `path-add: 找不到路径“${arg}”，因为该路径不存在。`, cls: "t-err" });
      result.lines.push({ text: "PATH 只能登记真实存在的文件夹——先 ls 确认它在那儿。", cls: "t-dim" });
      return result;
    }
    if(node === null){
      result.err = true;
      result.lines.push({ text: `path-add: “${pathStr(r)}” 是一个文件，不是文件夹。PATH 清单里登记的全是文件夹。`, cls: "t-err" });
      return result;
    }
    const p = pathStr(r);
    const idx = (state.path || []).map(x => x.toLowerCase()).indexOf(p.toLowerCase());
    if(idx !== -1){
      result.lines.push({ text: `“${p}” 已经在 PATH 清单里了（第 ${idx + 1} 格）。`, cls: "t-dim" });
      return result;
    }
    state.path.push(p);
    result.lines.push({ text: `✓ 已加入本窗口的 PATH 副本（第 ${state.path.length} 格）。`, cls: "t-green" });
    result.lines.push({ text: "(注意「本窗口」：环境变量是每个进程的副本。真实 Windows 里要改系统设置，且已打开的窗口不会自动更新 —— Level 7 详解。)", cls: "t-dim" });
    return result;
  }

  if(cmd === "env"){
    const vars = [
      ["USERNAME=YOGA", "t-ok"],
      ["USERPROFILE=C:\\Users\\YOGA", "t-ok"],
      ["OS=Windows_NT", "t-ok"],
      ["HOME=C:\\Users\\YOGA", "t-ok"],
      ["TEMP=C:\\Users\\YOGA\\AppData\\Local\\Temp", "t-ok"],
      ["PATH=" + (state.path || []).join(";"), "t-ok"]
    ];
    vars.forEach(v => result.lines.push({ text: v[0], cls: v[1] }));
    result.lines.push({ text: "(这是当前进程的环境变量副本——进程出生时 OS 发的便签。真实 PowerShell 里用 ls env: 或 Get-ChildItem Env: 查看。)", cls: "t-dim" });
    return result;
  }

  if(cmd === "echo"){
    result.lines.push({ text: result.args.join(" "), cls: "t-ok" });
    return result;
  }

  // ===== GUI 启动模拟：terminal 也能打开 GUI 程序/文件 =====
  // 教学点：你在 terminal 输入命令 → shell 找到程序 → 启动它 → 它打开一个 GUI 窗口
  if(cmd === "notepad" || cmd === "code" || cmd === "start" || cmd === "explorer"){
    let target = result.args[0] || ".";
    // -r/--reuse-window 等 VS Code 选项：跳过，取最后一个参数
    if(cmd === "code" && result.args.length > 0){
      const nonFlag = result.args.filter(a => a.charAt(0) !== "-");
      target = nonFlag.length ? nonFlag[nonFlag.length - 1] : ".";
    }
    const r = resolvePath(state, target);
    const node = r ? getNode(state.fs, r) : undefined;
    if(!r || node === undefined){
      result.err = true;
      result.lines.push({ text: `${cmd}: 找不到路径“${target}”，因为该路径不存在。`, cls: "t-err" });
      return result;
    }
    result.resolved = r.slice();
    const full = pathStr(r);
    if(cmd === "notepad"){
      if(node !== null){
        result.err = true;
        result.lines.push({ text: `notepad: “${full}” 是一个文件夹。记事本只能打开文件。`, cls: "t-err" });
        result.lines.push({ text: "（想打开文件夹请用 explorer . ）", cls: "t-dim" });
        return result;
      }
      result.lines.push({ text: "【模拟 GUI】一个记事本窗口弹出，正在编辑 " + full, cls: "t-green" });
      result.lines.push({ text: "(shell 找到 notepad.exe → OS 启动它 → 它打开了这个文件。命令行 ≠ 只能用文字)", cls: "t-dim" });
      return result;
    }
    if(cmd === "code"){
      result.lines.push({ text: "【模拟 GUI】VS Code 窗口启动，打开了 " + full + (node !== null ? "\\" : ""), cls: "t-green" });
      result.lines.push({ text: "(真实场景：code . 是开发者每天用的命令——在 VS Code 里打开当前文件夹)", cls: "t-dim" });
      return result;
    }
    // start / explorer → File Explorer
    if(node === null){
      result.err = true;
      result.lines.push({ text: `explorer: “${full}” 是一个文件，不是文件夹。`, cls: "t-err" });
      result.lines.push({ text: "（想打开文件请用 notepad 或 start 文件名）", cls: "t-dim" });
      return result;
    }
    result.lines.push({ text: "【模拟 GUI】一个文件资源管理器窗口弹出，停在 " + full + "\\", cls: "t-green" });
    result.lines.push({ text: "(你在 GUI 里双击文件夹做的事，terminal 里一行命令也能做——操作的是同一棵树)", cls: "t-dim" });
    return result;
  }

  if(cmd === "help"){
    result.lines.push({ text: "本模拟器支持的命令：", cls: "t-dim" });
    ["pwd / Get-Location   - print current path", "ls / Get-ChildItem    - list members (supports pattern like *.txt)", "cd / Set-Location     - change directory", "mkdir <name>          - create a folder (quote names with spaces)", "touch <file>          - create an empty file", "cat <file>            - print a file's content", "cp <src> <dst>        - copy a file/folder", "mv <src> <dst>        - move / rename", "rm <file> / rm -r <dir>- delete (folder needs -r; supports *.txt)", "quotes: \"my folder\"   - one argument with spaces inside", "git --version         - run git, print its version", "where <name>          - search the PATH list for a program", "path                  - print the PATH list", "path-add <dir>        - add a folder to this window's PATH (practice command)", "env                   - show this process's environment variables", "echo <text>           - print text", "notepad <file>        - open a file in a GUI editor", "code [path]           - open a folder/file in VS Code (GUI)", "start / explorer [dir]- open a folder in File Explorer (GUI)", "clear                 - clear the screen"].forEach(t => result.lines.push({ text: t, cls: "t-ok" }));
    return result;
  }

  // ===== PATH 程序运行器 =====
  // 模拟真实 shell：收到程序名时，按 PATH 清单从上往下逐格找 程序名.exe
  {
    const exeName = cmd + ".exe";
    let foundDir = null;
    for(const d of (state.path || [])){
      const segs = splitPath(d);
      const node = getNode(state.fs, segs);
      if(typeof node === "object" && node !== null && exeName in node){ foundDir = segs; break; }
    }
    if(foundDir){
      result.resolved = foundDir.concat(exeName);
      if(cmd === "hello-tool"){
        result.lines.push({ text: "Hello from hello-tool! 👋", cls: "t-ok" });
        result.lines.push({ text: "(hello-tool.exe 在 PATH 第 " + ((state.path || []).map(x => x.toLowerCase()).indexOf(pathStr(foundDir).toLowerCase()) + 1) + " 格被找到并运行)", cls: "t-dim" });
        return result;
      }
      if(cmd === "latex" || cmd === "latexmk" || cmd === "perl" || cmd === "python"){
        const ver = {
          latex: "MiKTeX-TeX 4.22 (MiKTeX 24.4)",
          latexmk: "Latexmk, John Collins, 31 Jan. 2025. Version 4.86",
          perl: "This is perl 5, version 40, subversion 0 (v5.40.0) built for MSWin32-x64-multi-thread",
          python: "Python 3.13.2"
        };
        result.lines.push({ text: ver[cmd], cls: "t-ok" });
        result.lines.push({ text: "(shell 在 PATH 清单里找到 " + exeName + " —— 它的安装程序早就把文件夹报进了户口)", cls: "t-dim" });
        return result;
      }
      result.lines.push({ text: exeName + " ran.", cls: "t-ok" });
      return result;
    }
  }

  // 未知命令：模拟 command not found
  result.err = true;
  result.lines.push({ text: `${cmd} : 无法将“${cmd}”项识别为 cmdlet、函数、脚本文件或可运行程序的名称。`, cls: "t-err" });
  result.lines.push({ text: `（意思是：电脑找不到叫“${cmd}”的程序。检查拼写，或先学习如何安装程序 —— 这是 Level 6 的内容）`, cls: "t-dim" });
  return result;
}

        { t: `<span class="term-inline">notes.txt</span> —— 你的笔记`, ok: false, why: "纯文本文件，内容是给人看的。" }
      ],
      explain: `答案是 <strong>python.exe</strong>。它是一个可执行文件（executable），CPU 能直接执行里面的指令。而 hello.py 虽然也是代码，但 CPU 看不懂它——必须靠 python.exe 这个「翻译官」运行。<br><br>这个区别后面会反复用到：为什么输入 <span class="term-inline">latex --version</span> 电脑能找到 latex？因为它知道 latex.exe 躺在硬盘哪里。`
    }
  ]
},
{
  id: 1,
  module: "01 · Computer Basics",
  title: "文件和文件夹",
  en: "Files & Folders",
  summary: "理解了文件（有名字的内容）和文件夹（容器）的关系，以及硬盘上的文件是「树」状组织的。",
  steps: [
    { type: "concept",
      title: "文件 = 纸，文件夹 = 夹子",
      body: `
        <p><strong>文件 (file)</strong>：一张纸。有名字（<span class="term-inline">notes.txt</span>）、有内容（你的笔记文字）。</p>
        <p><strong>文件夹 (folder)</strong>，也叫<strong>目录 (directory)</strong>：一个夹子。它本身没有「内容」，只有「成员」——里面装的纸，或更小的夹子。</p>
        <p>于是硬盘上的东西天然形成了一棵<strong>树 (tree)</strong>：大夹子套小夹子，最里面才是纸。最顶上的那个夹子（比如 <span class="term-inline">C:\\</span>）叫<strong>根 (root)</strong>。</p>`,
      visual: `
        <div class="diagram">
        <svg width="560" height="200" viewBox="0 0 560 200">
          <rect x="220" y="10" width="120" height="36" rx="8" fill="#161b22" stroke="#58a6ff"/>
          <text x="280" y="33" fill="#e6edf3" font-size="13" text-anchor="middle">C:\\ （根 root）</text>
          <rect x="80" y="80" width="120" height="36" rx="8" fill="#161b22" stroke="#2d333f"/>
          <text x="140" y="103" fill="#e6edf3" font-size="13" text-anchor="middle">Users\\</text>

          <text x="420" y="103" fill="#9aa7b4" font-size="13" text-anchor="middle">（还有别的盘…）</text>

          <text x="140" y="171" fill="#e6edf3" font-size="13" text-anchor="middle">YOGA\\</text>
          <line x1="280" y1="46" x2="140" y2="80" stroke="#2d333f" stroke-width="2"/>
          <line x1="280" y1="46" x2="420" y2="80" stroke="#2d333f" stroke-width="2"/>
          <line x1="140" y1="116" x2="140" y2="148" stroke="#3fb950" stroke-width="2"/>
          <text x="300" y="170" fill="#9aa7b4" font-size="12">YOGA 里面还有 Desktop、Documents、Downloads…（下一关自己展开看）</text>
        </svg>
        <div class="cap">树 = 一层套一层的文件夹，文件长在树枝末端。</div>
        </div>`,
      key: "文件夹可以装文件，<strong>也可以装别的文件夹</strong>。这种一层套一层的结构就是「树」。"
    },
    { type: "explore",
      title: "动手：探索你的（虚拟）电脑",
      body: `
        <p>下面是一台<strong>模拟的</strong> Windows 电脑的文件树（结构参考你自己的电脑）。</p>
        <p><strong>任务：点击文件夹，展开看看里面有什么；再点一次收起。</strong>注意观察：</p>
        <ul>
          <li>名字后面带 <span class="term-inline">\\</span> 的是文件夹，不带的是文件。</li>
          <li>哪个文件夹里面还套着文件夹？</li>
          <li>找到 <span class="term-inline">hello.py</span> 和 <span class="term-inline">简历.tex</span>，记住它们「住」在哪一层。</li>
        </ul>`,
      key: "路径 <span class='term-inline'>C:\\Users\\YOGA</span> 是「你的家」——个人文件都住在这棵子树下。下一关你会学到它叫 home directory（家目录）。"
    },
    { type: "predict",
      title: "预测：移动文件之后，哪棵树是对的？",
      scenario: `
        现在 <span class="term-inline">notes.txt</span> 在 <span class="term-inline">C:\\Users\\YOGA\\</span> 这一层。你把<strong>移动</strong>（不是复制）到 <span class="term-inline">Documents</span> 文件夹里。<br><br>
        移动之后，下面哪一棵「局部树」描述是正确的？`,
      options: [
        { t: `<pre style="font-family:var(--mono);font-size:13px;line-height:1.7">YOGA\\
├── hello.py
├── readme.md
├── notes.txt          ← 还在原地
└── Documents\\
    └── 数学作业.docx</pre>`, ok: false, why: "这是「复制」的结果，不是「移动」。移动后原位置不该再有它。" },
        { t: `<pre style="font-family:var(--mono);font-size:13px;line-height:1.7">YOGA\\
├── hello.py
├── readme.md
└── Documents\\
    ├── notes.txt      ← 搬到了这里
    ├── 数学作业.docx
    └── 简历.tex</pre>`, ok: true },
        { t: `notes.txt 被「打开」在 Documents 里，YOGA 里还留着一个`, ok: false, why: "「打开」不是移动。打开只是看一眼，文件位置不变。" }
      ],
      explain: `移动 = <strong>把一个成员从一个文件夹改挂到另一个文件夹名下</strong>。整张「纸」只有一份，只是换了住的夹子。<br><br>这个 mental model 马上会救你一命：很多人以为 <span class="term-inline">cd Documents</span> 是「把东西移进 Documents」——完全不是。具体为什么，Level 3 见。`
    },
    { type: "predict",
      title: "小测验：关于文件夹，哪个说法正确？",
      scenario: `回想文件夹的三个特征：① 是容器 ② 装「成员」 ③ 成员可以是文件或其他文件夹。`,
      options: [
        { t: "文件夹里只能装文件，不能装文件夹", ok: false, why: "如果这样，树就永远只有两层了。现实是 Users 里装着 YOGA，YOGA 里又装着 Documents。" },
        { t: "文件夹可以装文件，也可以装别的文件夹，所以可以一层套一层", ok: true },
        { t: "文件夹本质上是一种程序", ok: false, why: "文件夹没有指令清单，它只是硬盘上的一种「登记表」：记着成员名字和位置。" },
        { t: "一个文件可以同时属于两个文件夹", ok: false, why: "在树结构里，每个文件只有一个「父文件夹」（ shortcuts/快捷方式除外，那是另一种指针）。" }
      ],
      explain: `答案 B。树结构的核心规则：<strong>每个文件/文件夹都有且只有一个父文件夹</strong>，父文件夹里登记着它的名字。理解「登记」这个比喻，后面理解 Git 的 staging area 会轻松很多。`
    }
  ]
}
,
{
  id: 2,
  module: "01 · Computer Basics",
  title: "路径 —— 文件的地址",
  en: "Paths",
  summary: "掌握了路径（文件的地址）的写法：盘符\\用户\\文件夹\\文件名，以及绝对路径与相对路径的区别和 .. 的含义。",
  steps: [
    { type: "concept",
      title: "路径 = 邮寄地址",
      body: `
        <p>光有「树」还不够。电脑怎么知道你想找哪张纸？靠<strong>路径 (path)</strong>——文件的完整地址。</p>
        <p>Windows 的路径从<strong>盘符 (drive letter)</strong>开始，用 <span class="term-inline">\\</span> 一段一段往下钻：</p>`,
      visual: `
        <div class="diagram">
        <svg width="680" height="130" viewBox="0 0 680 130">
          <g font-size="12" text-anchor="middle">
            <rect x="10"  y="30" width="70"  height="44" rx="8" fill="#161b22" stroke="#58a6ff"/><text x="45"  y="50" fill="#a5d6ff" font-family="Consolas,monospace" font-size="15">C:</text><text x="45" y="66" fill="#9aa7b4">盘符 从哪块硬盘开始</text>
            <text x="96" y="58" fill="#2d333f" font-size="20">\\</text>
            <rect x="110" y="30" width="90"  height="44" rx="8" fill="#161b22" stroke="#2d333f"/><text x="155" y="50" fill="#e6edf3" font-family="Consolas,monospace" font-size="15">Users</text><text x="155" y="66" fill="#9aa7b4">系统的「用户」区</text>
            <text x="212" y="58" fill="#2d333f" font-size="20">\\</text>
            <rect x="226" y="30" width="90"  height="44" rx="8" fill="#161b22" stroke="#3fb950"/><text x="271" y="50" fill="#3fb950" font-family="Consolas,monospace" font-size="15">YOGA</text><text x="271" y="66" fill="#9aa7b4">你的用户名</text>
            <text x="328" y="58" fill="#2d333f" font-size="20">\\</text>
            <rect x="342" y="30" width="110" height="44" rx="8" fill="#161b22" stroke="#2d333f"/><text x="397" y="50" fill="#e6edf3" font-family="Consolas,monospace" font-size="15">Documents</text><text x="397" y="66" fill="#9aa7b4">文件夹</text>
            <text x="464" y="58" fill="#2d333f" font-size="20">\\</text>
            <rect x="478" y="30" width="110" height="44" rx="8" fill="#161b22" stroke="#d29922"/><text x="533" y="50" fill="#d29922" font-family="Consolas,monospace" font-size="15">notes.txt</text><text x="533" y="66" fill="#9aa7b4">文件名（终点）</text>
          </g>
        </svg>
        <div class="cap">C:\\Users\\YOGA\\Documents\\notes.txt —— 每一段都是一次「进入下一层文件夹」。</div>
        </div>`,
      key: "读路径的方法就是<strong>从左往右逐层敲门</strong>：先进 C: 盘 → 进 Users → 进 YOGA → 进 Documents → 找到 notes.txt。少了任何一段，地址都不完整。"
    },
    { type: "concept",
      title: "绝对路径 vs 相对路径",
      body: `
        <p><strong>绝对路径 (absolute path)</strong>：从盘符开始的完整地址。<span class="term-inline">C:\\Users\\YOGA\\Documents\\notes.txt</span>。不管你在哪，它都指向同一个文件——像身份证上的完整户籍地址。</p>
        <p><strong>相对路径 (relative path)</strong>：从「你当前所在的位置」出发的走法。<span class="term-inline">Documents\\notes.txt</span> 的意思是：<em>从我现在站的地方</em>出发，先进 Documents，再找 notes.txt。像「出门左拐的便利店」——你在哪，决定了它指哪。</p>
        <div class="key-point">⚠️ 同一个相对路径，<strong>站在不同的地方输入，结果完全不同</strong>。这是新手 80% 的「找不到文件」错误的根源。</div>
        <p>两个特殊记号：<span class="term-inline">.</span>（一个点）= 当前这层；<span class="term-inline">..</span>（两个点）= 上一层文件夹。它们在任何文件夹里都管用。</p>`,
      key: "<strong>绝对 = 完整地址（从盘符开始）。相对 = 从当前位置怎么走（.. 是上楼，名字是下楼进房间）。</strong>"
    },
    { type: "predict",
      title: "预测：哪个是相对路径？",
      scenario: `假设你当前「站在」 <span class="term-inline">C:\\Users\\YOGA</span>，目标是 <span class="term-inline">Documents</span> 里的 <span class="term-inline">notes.txt</span>。下面哪个写法是<strong>相对路径</strong>？`,
      options: [
        { t: `<span class="term-inline">C:\\Users\\YOGA\\Documents\\notes.txt</span>`, ok: false, why: "这是绝对路径——它从盘符 C: 开始，是完整地址。" },
        { t: `<span class="term-inline">Documents\\notes.txt</span>`, ok: true },
        { t: `<span class="term-inline">\\notes.txt</span>`, ok: false, why: "开头写 \\ 表示「从当前盘的根开始」，这更接近绝对写法；而且根目录下根本没有 notes.txt。" },
        { t: `<span class="term-inline">YOGA\\Documents\\notes.txt</span>`, ok: false, why: "从当前位置（已经在 YOGA 里）再进 YOGA\\，会去找 YOGA\\YOGA\\Documents\\notes.txt —— 不存在。" }
      ],
      explain: `答案是 <strong>Documents\\notes.txt</strong>。它没从盘符开始，只是「从当前位置出发」的走法。<br><br>注意选项 D 的陷阱：相对路径是<strong>从你站的地方</strong>算起的，你已经站在 YOGA 里了，不需要再进一次 YOGA。`
    },
    { type: "predict",
      title: "预测：.. 指的是哪里？",
      scenario: `你当前在 <span class="term-inline">C:\\Users\\YOGA\\Documents</span>。这时出现一个叫 <span class="term-inline">..</span> 的记号（两个点）。它指的是哪个文件夹？`,
      options: [
        { t: `<span class="term-inline">C:\\Users\\YOGA</span>`, ok: true },
        { t: `<span class="term-inline">C:\\Users</span>`, ok: false, why: "只上了一层楼。Documents 的上一层是 YOGA，不是 Users。" },
        { t: `<span class="term-inline">C:\\</span>`, ok: false, why: "那是上两层。一层一层来：Documents → YOGA。" },
        { t: `不存在这个文件夹`, ok: false, why: ".. 不是一个真实存在的文件夹，它是一个「指针」：无论你在哪，它都指向你的上一层。所以任何一层都能用。" }
      ],
      explain: `答案是 <strong>C:\\Users\\YOGA</strong>。<span class="term-inline">..</span> 永远指向你的上一层。<br><br>记忆法：树状的文件夹像一栋楼，你在一楼，<span class="term-inline">cd ..</span> 就是「上楼一层」。`
    },
    { type: "predict",
      title: "小测验：哪一个是绝对路径？",
      scenario: `火眼金睛：下面四个里只有一个是绝对路径。`,
      options: [
        { t: `<span class="term-inline">Downloads\\setup.exe</span>`, ok: false, why: "没有盘符开头，是相对路径。" },
        { t: `<span class="term-inline">C:\\Users\\YOGA\\Downloads\\setup.exe</span>`, ok: true },
        { t: `<span class="term-inline">..\\Pictures\\猫.jpg</span>`, ok: false, why: "从 ..（上一层）出发，是相对路径。" },
        { t: `<span class="term-inline">.\\hello.py</span>`, ok: false, why: "从 .（当前层）出发，是相对路径。" }
      ],
      explain: `答案 B。判断标准只有一个：<strong>是否以盘符（X:\\）开头</strong>。开头的才是绝对路径。`
    }
  ]
},
{
  id: 3,
  module: "02 · Command Line ⭐",
  title: "Terminal 是什么",
  en: "What is a Terminal?",
  summary: "理解了终端 = 用文字给电脑下指令；会用了 pwd / ls / cd，知道 cd 只改变「当前位置」不移动文件，并学会阅读错误信息。",
  steps: [
    { type: "concept",
      title: "终端 = 用文字给电脑下指令",
      body: `
        <p>到目前为止，你用电脑的方式是<strong>图形界面 (GUI)</strong>：看图标、点点点。电脑把这些点击「翻译」成指令执行。</p>
        <p><strong>终端 (terminal)</strong> 是另一种方式：你直接打文字指令，电脑执行后把结果用文字打回来。一令一答，像发短信。</p>
        <p>Windows 上常见的终端程序叫 <strong>PowerShell</strong>（蓝色的那个窗口）。你之前在 PowerShell 里成功运行过 <span class="term-inline">latex --version</span>——<strong>你其实已经在用终端了</strong>，只是当时不知道。</p>
        <p>打开终端后，你看到的这一行叫<strong>提示符 (prompt)</strong>，它在「报自己的位置」：</p>`,
      visual: `
        <div class="diagram">
        <svg width="640" height="120" viewBox="0 0 640 120">
          <rect x="30" y="35" width="580" height="52" rx="10" fill="#010409" stroke="#2d333f"/>
          <g font-family="Consolas,monospace" font-size="16">
            <text x="55" y="67" fill="#3fb950">PS</text>
            <text x="90" y="67" fill="#2d333f">|</text>
            <text x="105" y="67" fill="#58a6ff">C:\\Users\\YOGA</text>
            <text x="250" y="67" fill="#2d333f">|</text>
            <text x="265" y="67" fill="#e6edf3">&gt;</text>
            <rect x="282" y="50" width="10" height="24" fill="#3fb950"><animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/></rect>
          </g>
          <g font-size="11" fill="#9aa7b4" text-anchor="middle">
            <text x="72" y="105">① PS = PowerShell 的标记</text>
            <text x="177" y="105">② 当前目录（你站在哪）</text>
            <text x="272" y="105">③ 光标：等你输入</text>
          </g>
        </svg>
        <div class="cap">提示符 <span style="font-family:var(--mono);color:#3fb950">PS C:\\Users\\YOGA&gt;</span> 读作：「PowerShell 报到，你当前在 C:\\Users\\YOGA，请下指令」。</div>
        </div>`,
      key: "终端里始终有一个「<strong>当前目录 (current directory)</strong>」——你站在树的哪一层。绝大多数路径 confusion 都是忘了「我站在哪」。"
    },
    { type: "predict",
      title: "预测：pwd 会做什么？",
      scenario: `第一个命令来了：<span class="term-inline">pwd</span>（print working directory，打印当前工作目录）。<br><br>在终端里输入 pwd 并回车，会发生什么？`,
      options: [
        { t: "把当前所在的路径打印出来，比如 C:\\Users\\YOGA", ok: true },
        { t: "把你「上移」一层文件夹", ok: false, why: "改变位置的是 cd 命令，pwd 只是「问问题」。" },
        { t: "列出当前文件夹里所有文件", ok: false, why: "那是下一个命令 ls 的工作。" },
        { t: "清空终端屏幕", ok: false, why: "清空是 clear。pwd 不修改任何东西。" }
      ],
      explain: `答案 A。pwd 是终端世界的「我在哪？」——它<strong>只提问，不改变任何东西</strong>。这是一个重要模式：有的命令是「提问」（pwd、ls），有的命令是「行动」（cd）。`
    },
    { type: "terminal",
      title: "动手：pwd —— 问电脑「我在哪？」",
      goal: "在下方终端模拟器里输入 pwd 并回车，观察输出。",
      background: "pwd = print working directory。它把终端的「当前目录」原样打印出来。注意提示符 <span class='term-inline'>PS C:\\Users\\YOGA&gt;</span> 里其实已经写着答案了——pwd 是让它正式「说出口」。",
      hints: [
        "这个命令只有 3 个字母，不需要任何参数。",
        "不用加任何东西，只输入命令本身。",
        "答案：<code>pwd</code> —— 输入它，按 Enter。"
      ],
      validate: (r, s) => !r.err && r.cmd === "pwd",
      success: "看！终端「说」出了你当前的位置。注意：pwd 之后提示符没有任何变化——因为你没有移动，只是问了个问题。",
      internals: "pwd 的内部过程：终端收到 pwd → 查一下自己记录的「当前目录」变量 → 把这个字符串打印出来。<strong>整个过程没有触碰硬盘上的任何文件。</strong>",
      breakdown: [
        { token: "pwd", label: "命令 command", text: "print working directory 的缩写。意思是「告诉我现在的工作目录是什么」。" }
      ]
    },
    { type: "terminal",
      title: "动手：ls —— 看看这层有什么",
      goal: "输入 ls 并回车，看看当前文件夹里住着谁。",
      background: "ls = list（列出）。它把<strong>当前目录</strong>的成员名单打印出来：文件夹的名字后面会带 \\。同样——它只是「看一眼」，不改变任何东西。",
      hints: [
        "两个字母的命令，list 的缩写。",
        "直接输入 ls 回车。",
        "答案：<code>ls</code>"
      ],

    { type: "concept",
      title: "Standard User vs Administrator：权限的三层词",
      body: `
        <p>这一组概念用三个词讲清：</p>
        <ul>
          <li><strong>Permission（许可）</strong>：对具体资源的允许/拒绝。比如「你的账户能不能写 C:\\Windows」。</li>
          <li><strong>Privilege（特权级别）</strong>：你账户的整体权限档位。日常你是 standard user（标准用户）：能完全控制自己的文件，<strong>不能</strong>动系统区域——还记得 <span class="term-inline">cd C:\\Windows</span> 的 Access denied 吗？那就是权限在工作，不是错误。</li>
          <li><strong>Elevation（提权）</strong>：临时升档的动作。右键「以管理员身份运行」打开的 elevated terminal，标题栏会多一个 Administrator 字样；里面的命令有了动系统的许可。那个 UAC 弹窗就是提权的门禁。</li>
        </ul>
        <p><strong>Least privilege（最小权限原则）</strong>：平时用普通权限，只在确实需要时提权。理由很朴素——在管理员窗口里，一次手滑的 <span class="term-inline">rm</span> 可能删掉系统；在普通窗口里，它只会拒绝你。<strong>Permission denied 常常不是「出问题了」，而是「这个操作本来就不该由现在的你做」。</strong></p>`,

  en: "Command Line Foundations",
  summary: "回答「What am I talking to?」：GUI 与 CLI 都是在向计算机下指令；Terminal 窗口里发生的事（按键→转发→Shell 解析）；PowerShell / CMD / Bash 对比；Unix / Linux / Bash / Git Bash / WSL 家族关系；Git / Git Bash / GitHub 三问辨析；Permission / Privilege / Elevation 与最小权限。",
  steps: [
    { type: "concept",
      title: "GUI vs CLI：两种说法，同一件事",
      body: `
        <p>重新看 GUI 和 CLI——不停在定义上，看它们的<strong>共同点</strong>：</p>
        <p>不管你在 File Explorer 里<strong>拖动文件</strong>，还是在 terminal 里输入 <span class="term-inline">mv file.txt Documents</span>，你都在做同一件事：<strong>向计算机表达「我要它做什么」</strong>。区别只在表达方式——鼠标点击 vs 键盘文字。</p>
        <ul>
          <li>GUI 的指令藏在按钮、菜单、拖放里，看不见摸不着；</li>
          <li>CLI 的指令就是你写下的那行<strong>文字</strong>——可以抄下来、可以改一个字母再试、可以成为别人的经验。</li>
        </ul>
        <p>这就是命令行值得学的原因：它把「操作」变成了「可以阅读和编辑的文字」。</p>`,

          <text x="480" y="92" fill="#9aa7b4" font-size="11" text-anchor="middle">（指令是文字：可读、可改、可抄）</text>
          <text x="310" y="152" fill="#3fb950" font-size="12" text-anchor="middle" font-weight="bold">同一个意图：把 file.txt 移进 Documents</text>
        </svg>
        <div class="cap">点击和打字都是「下指令」。CLI 的超能力：指令显形成文字。</div>
        </div>`,
      key: "<strong>GUI 和 CLI 都在表达「我要它做什么」。</strong>CLI 把指令变成文字——可保存、可搜索、可复用。"

    { type: "concept",
      title: "一个 Terminal 窗口里到底发生了什么",
      body: `
        <p>把你的一个按键放大一万倍看。你在 terminal 里键入 <span class="term-inline">p</span> 到屏幕上出现 <span class="term-inline">p</span>，中间经过了两站：</p>

    { type: "concept",
      title: "PowerShell / CMD / Bash：三兄弟对比卡",
      body: `
        <p>三种 shell 一张卡带走。先看共同身份：都是 shell——都干「读命令、找程序、回显结果」的活。</p>
        <ul>
          <li><strong>CMD</strong>（cmd.exe）：Windows 自带老牌 shell，DOS 时代遗产。提示符 <span class="term-inline">C:\&gt;</span>。内置命令少，语法古老，但每台 Windows 都有。</li>
          <li><strong>PowerShell</strong>：Windows 现代 shell（也是跨平台开源的）。提示符 <span class="term-inline">PS C:\&gt;</span>。Cmdlet 是 <span class="term-inline">Verb-Noun</span> 风格（Get-Location、Set-Location），管道传对象而不仅是文字。</li>
          <li><strong>Bash</strong>：Unix/Linux 世界的标准 shell，提示符 <span class="term-inline">$</span>。经 Git Bash / WSL 来到 Windows。生态最大：网上的命令行教程 80% 默认 Bash 语法。</li>
        </ul>
        <p>关键视角：<strong>你在网上搜到一条命令跑不通时，第一问不是「命令错了」，而是「它写给哪个 shell 的」。</strong></p>`,

          <text x="330" y="38" fill="#58a6ff" font-size="13" text-anchor="middle" font-weight="bold">PowerShell</text>
          <text x="330" y="60" fill="#a5d6ff" font-size="10" text-anchor="middle" font-family="Consolas,monospace">PS C:\Users\YOGA&gt;</text>

          <text x="330" y="100" fill="#9aa7b4" font-size="10" text-anchor="middle">Verb-Noun：Get-ChildItem</text>
          <text x="330" y="124" fill="#9aa7b4" font-size="10" text-anchor="middle">管道传对象</text>

          <text x="547" y="60" fill="#e6edf3" font-size="10" text-anchor="middle" font-family="Consolas,monospace">YOGA@PC:~$</text>
          <text x="547" y="84" fill="#9aa7b4" font-size="10" text-anchor="middle">Linux/Unix 世界标准</text>
          <text x="547" y="100" fill="#9aa7b4" font-size="10" text-anchor="middle">网上教程默认语法</text>
          <text x="547" y="124" fill="#9aa7b4" font-size="10" text-anchor="middle">经 Git Bash / WSL 上 Windows</text>
          <text x="330" y="172" fill="#3fb950" font-size="11" text-anchor="middle" font-weight="bold">都是 shell。口音不同、词汇不同、内置命令不同。</text>

/* ---------- 通用命令拆解器 ----------
   把任意命令行拆成 program / subcommand / option / argument。
   这是「让我逐渐学会自己阅读命令」的核心工具。 */
function dissectLine(line){
  const row = document.getElementById("dissectRow");
  const tokens = String(line).trim().match(/"[^"]*"|\S+/g) || []; // 引号包住的算一个 token
  if(tokens.length === 0){ row.classList.remove("show"); return; }
  const parts = [];
  parts.push({ tok: tokens[0], role: "program 程序", cls: "role-program", tip: "要运行的程序。电脑会去 PATH 等地方找它（Level 6 详解）。" });
  let i = 1;
  if(tokens[0] === "git" && tokens[1] && !tokens[1].startsWith("-")){
    parts.push({ tok: tokens[1], role: "subcommand 子命令", cls: "role-subcommand", tip: "git 的具体动作。git 本身只是工具箱，commit / push 才是动作。" });
    i = 2;
  }
  for(; i < tokens.length; i++){
    const t = tokens[i];
    if(t.startsWith("-")) parts.push({ tok: t, role: "option / flag 选项", cls: "role-option", tip: "开关，用来改变命令的行为，不是操作对象。" });
    else parts.push({ tok: t, role: "argument 参数", cls: "", tip: "命令作用的对象：文件、文件夹、或要写的内容。" });
  }
  row.innerHTML = `<span style="color:var(--dim);align-self:center;flex-shrink:0">🔍 tokens:</span>` + parts.map(p =>
    `<span class="chip ${p.cls}" title="${esc(p.tip)}"><span class="chip-tok">${esc(p.tok)}</span><span class="chip-role">${esc(p.role)}</span></span>`).join("");
  row.classList.add("show");
}

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

const STORE_KEY = "cli-course-progress-v1";
let store;
try { store = JSON.parse(localStorage.getItem(STORE_KEY)) || null; } catch(e){ store = null; }
if(!store || typeof store !== "object" || Array.isArray(store)) store = { level: 0, step: 0, completed: {} };
if(typeof store.completed !== "object" || !store.completed || Array.isArray(store.completed)) store.completed = {};
// 防御：任何越界/损坏的进度数据都钳回有效范围，绝不让整页空白
store.level = Math.floor(Number(store.level));
if(!Number.isFinite(store.level) || store.level < 0 || store.level >= LEVELS.length) store.level = 0;
store.step = Math.floor(Number(store.step));
if(!Number.isFinite(store.step) || store.step < 0 || store.step >= LEVELS[store.level].steps.length) store.step = 0;

function saveStore(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(store)); }catch(e){} }

function totalSteps(){ return LEVELS.reduce((a, l) => a + l.steps.length, 0); }
function completedCount(){
  let n = 0;
  LEVELS.forEach((l, i) => { n += Math.min(store.completed[i] != null ? store.completed[i] + 1 : (i < store.level ? l.steps.length : 0), l.steps.length); });
  return n;
}
function levelDone(i){ return store.completed[i] != null && store.completed[i] >= LEVELS[i].steps.length - 1; }

function markStepDone(li, si){
  if((store.completed[li] || 0) < si) store.completed[li] = si;
  saveStore();
}

let term = createTermState();
const termOut = document.getElementById("termOut");
const termInput = document.getElementById("termInput");
const termPromptEl = document.getElementById("termPrompt");
const termCwdEl = document.getElementById("termCwd");

function updatePrompt(){
  const p = "PS " + pathStr(term.cwd) + ">";
  termPromptEl.textContent = p;
  termCwdEl.textContent = pathStr(term.cwd);
}
function termPrint(text, cls){
  const div = document.createElement("div");
  div.className = "t-line " + (cls || "");
  div.textContent = text;
  termOut.appendChild(div);
  termOut.scrollTop = termOut.scrollHeight;
}
function resetTerminal(silent){
  term = createTermState();
  termOut.innerHTML = "";
  updatePrompt();
  if(!silent){
    termPrint("Windows PowerShell simulator (virtual — never touches your real PC)", "t-dim");
    termPrint("Type help to see supported commands", "t-dim");
  }
}
document.getElementById("termReset").addEventListener("click", () => resetTerminal());

termInput.addEventListener("keydown", (e) => {
  if(e.key !== "Enter") return;
  const line = termInput.value;
  termInput.value = "";
  if(line.trim() === "") return;
  termPrint(termPromptEl.textContent + " " + line, "t-cmd");
  dissectLine(line);
  if(line.trim().toLowerCase() === "clear"){ termOut.innerHTML = ""; return; }
  const result = executeCommand(term, line);
  result.lines.forEach(l => termPrint(l.text, l.cls));
  updatePrompt();
  if(currentTerminalValidator){
    currentTerminalValidator(result);
  }
});

const stepContent = document.getElementById("stepContent");
const terminalDock = document.getElementById("terminalDock");
let currentTerminalValidator = null;

function kickerHTML(li, si){
  const l = LEVELS[li];
  return `<div class="step-kicker">Level ${l.id}<span class="sep">·</span>${esc(l.title)}<span class="sep">·</span>Step ${si + 1} / ${l.steps.length}</div>`;
}

function stepDotsHTML(li, si){
  const l = LEVELS[li];
  let h = '<div class="step-dots">';
  for(let i = 0; i < l.steps.length; i++){
    h += `<span class="dot ${i < si ? "done" : i === si ? "cur" : ""}"></span>`;
  }
  return h + "</div>";
}

function navHTML(li, si, nextEnabled){
  const l = LEVELS[li];
  const isLast = si === l.steps.length - 1;
  return `
    <div class="step-nav">
      <button class="btn" id="navPrev" ${si === 0 ? "disabled" : ""}>← Prev</button>
      ${stepDotsHTML(li, si)}
      <button class="btn ${nextEnabled ? "primary" : ""}" id="navNext" ${nextEnabled ? "" : "disabled"}>${isLast ? "Finish Level 🎉" : "Next →"}</button>
    </div>`;
}
function wireNav(li, si){
  const prev = document.getElementById("navPrev");
  const next = document.getElementById("navNext");
  if(prev) prev.addEventListener("click", () => { store.level = li; store.step = si - 1; saveStore(); render(); });
  if(next) next.addEventListener("click", () => {
    const l = LEVELS[li];
    if(si === l.steps.length - 1){
      // 最后一节完成 → 进入复习总结页（Learn → Practice → Review → Next）
      renderReview(li);
    } else {
      store.level = li; store.step = si + 1; saveStore(); render();
    }
  });
}

function render(){
  currentTerminalValidator = null;
  const li = store.level, si = store.step;
  const level = LEVELS[li];
  const step = level.steps[si];
  terminalDock.classList.toggle("hidden", step.type !== "terminal");

  if(step.type === "complete"){ renderReview(li); return; }

  let html = kickerHTML(li, si) + `<h2 class="step-title">${esc(step.title)}</h2>`;

  if(step.type === "concept"){
    if(step.bodyEn){
      // 语言框架：English-first，中文按需显示（Level 4+ 内容将默认提供 bodyEn）
      html += `<div class="card"><div id="enBody">${step.bodyEn}</div><div id="zhBody" style="display:none">${step.body}</div>

    } else {
      html += `<div class="card">${step.body}</div>`;
    }
    if(step.visual) html += step.visual;
    if(step.key) html += `<div class="key-point">🧠 <strong>Mental model：</strong>${step.key}</div>`;
    html += `<div style="margin-top:6px"><button class="btn success" id="understoodBtn">Got it — Continue →</button></div>`;
    html += navHTML(li, si, false);
    stepContent.innerHTML = html;
    document.getElementById("understoodBtn").addEventListener("click", () => {
      markStepDone(li, si);
      document.getElementById("navNext").disabled = false;
      document.getElementById("navNext").classList.add("primary");
      document.getElementById("understoodBtn").disabled = true;
      document.getElementById("understoodBtn").textContent = "✓ Done";
    });
    const lt = document.getElementById("langToggle");
    if(lt){
      lt.addEventListener("click", () => {
        const en = document.getElementById("enBody"), zh = document.getElementById("zhBody");
        const showingZh = zh.style.display !== "none";
        zh.style.display = showingZh ? "none" : "block";
        en.style.display = showingZh ? "block" : "none";
        lt.textContent = showingZh ? "💡 中文解释 / Show Chinese" : "🇬🇧 English";
      });
    }
  }

  if(step.type === "explore"){
    html += `<div class="card">${step.body}</div>`;
    html += `<div class="ft-note">📁 点击文件夹展开 / 收起</div>`;
    html += `<div class="filetree" id="ftRoot"></div>`;
    if(step.key) html += `<div class="key-point">🧠 <strong>Mental model：</strong>${step.key}</div>`;
    html += `<div style="margin-top:6px"><button class="btn success" id="exploreDoneBtn">Done Exploring — Continue →</button></div>`;
    html += navHTML(li, si, false);
    stepContent.innerHTML = html;
    buildFileTree(document.getElementById("ftRoot"), term.fs, []);
    document.getElementById("exploreDoneBtn").addEventListener("click", () => {
      markStepDone(li, si);
      document.getElementById("navNext").disabled = false;
      document.getElementById("navNext").classList.add("primary");
      document.getElementById("exploreDoneBtn").disabled = true;
      document.getElementById("exploreDoneBtn").textContent = "✓ Done";
    });
  }

  if(step.type === "predict"){
    html += `<div class="card"><div class="predict-scenario">${step.scenario}</div>`;
    html += `<div class="opt-list">` + step.options.map((o, i) =>
      `<button class="opt" data-i="${i}"><span class="opt-key">${"ABCD"[i]}</span><span>${o.t}</span></button>`).join("") + `</div>`;
    html += `<div class="feedback" id="fb"></div></div>`;
    html += navHTML(li, si, false);
    stepContent.innerHTML = html;
    const fb = document.getElementById("fb");
    let answered = false;
    stepContent.querySelectorAll(".opt").forEach(btn => {
      btn.addEventListener("click", () => {
        if(answered) return;
        const i = Number(btn.dataset.i);
        const opt = step.options[i];
        if(opt.ok){
          answered = true;
          btn.classList.add("correct");
          stepContent.querySelectorAll(".opt").forEach(b => b.disabled = true);
          fb.className = "feedback show ok";
          fb.innerHTML = `<strong>✅ Correct!</strong> <br>${step.explain}`;
          markStepDone(li, si);
          const nx = document.getElementById("navNext");
          nx.disabled = false; nx.classList.add("primary");
        } else {
          btn.classList.add("wrong");
          btn.disabled = true;
          fb.className = "feedback show no";
          fb.innerHTML = `<strong>❌ Not quite.</strong> ${opt.why || "Think again — the concept in the previous step has the clue."}<br>(wrong option eliminated — keep trying)`;
        }
      });
    });
  }

  /* ===== v1.3 Level 8 新题型共享工具 ===== */
  const finishStep = () => {
    markStepDone(li, si);
    const nx = document.getElementById("navNext");
    nx.disabled = false; nx.classList.add("primary");
  };
  const hintUI = `<div class="task-actions"><button class="btn" id="hintBtn2">💡 Hint</button></div><div class="hint-box" id="hintBox2"></div>`;
  const wireHint = (s) => {
    let lvl = 0;
    const hb = document.getElementById("hintBox2");
